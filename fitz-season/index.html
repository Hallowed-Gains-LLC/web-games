/* =====================  6. DRAWING  ===================== */

const easeOut = t => 1 - Math.pow(1 - t, 3);

function draw() {
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  let sx = 0, sy = 0;
  if (G.shake > 0 && !REDUCED_MOTION) { sx = rand(-G.shake, G.shake); sy = rand(-G.shake, G.shake); }
  ctx.translate(sx, sy);

  drawSky();
  drawShore();
  if (G.boss) drawBoss(G.boss);
  for (const e of G.enemies) if (!(e.kind === 'deckelf' && e.attached)) drawEnemy(e);
  for (const p of G.pickups) drawPickup(p);
  if (G.state === 'play' || G.state === 'paused') drawRange();
  drawShip();
  for (const e of G.enemies) if (e.kind === 'deckelf' && e.attached) drawEnemy(e);
  drawWater();
  for (const p of G.pellets) {
    ctx.fillStyle = '#4a3f3a'; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9b8b80'; ctx.beginPath(); ctx.arc(p.x - 1.2, p.y - 1.2, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  drawParticles();
  for (const ring of G.rings) {
    ctx.strokeStyle = `rgba(255, 209, 102, ${1 - ring.r / ring.max})`;
    ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2); ctx.stroke();
  }
  for (const f of G.floaters) {
    ctx.globalAlpha = 1 - f.t / f.life;
    ctx.font = "16px Bungee, sans-serif"; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
}

// Clouds and stars are fixed shapes; generated once.
const CLOUDS = Array.from({ length: 9 }, () => ({ x: rand(0, 1400), y: rand(0, 0.45), w: rand(120, 260), s: rand(6, 16) }));
const STARS = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random() * 0.8, r: rand(0.6, 1.6), ph: rand(0, 6) }));

// Each day runs from overcast afternoon to midnight: [time, top, horizon].
const SKY_KEYS = [
  [0.00, [104, 124, 146], [184, 194, 200]], // afternoon
  [0.40, [112, 118, 150], [226, 196, 160]], // getting golden
  [0.62, [92, 78, 124], [242, 146, 108]],   // sunset
  [0.80, [46, 46, 86], [140, 92, 120]],     // dusk
  [1.00, [16, 22, 44], [44, 54, 84]],       // midnight
];
const STORM = [[62, 70, 82], [110, 118, 126]];

/** 0 at the start of the day, 1 at midnight. */
function dayClock() {
  const d = DAYS[G.day];
  if (G.state === 'title' || !d) return 0.6;          // the title gets a sunset
  if (G.state === 'memorial') return 1;
  if (d.boss) return G.boss ? clamp(0.55 + 0.4 * (1 - G.boss.hp / BOSS_HP), 0, 0.95) : 0.95;
  return clamp(G.dayT / d.len, 0, 1);
}
const nightness = () => clamp((dayClock() - 0.7) / 0.3, 0, 1);
const mix = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgb = (c, a = 1) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;

function skyColors() {
  const t = dayClock();
  let i = 0;
  while (i < SKY_KEYS.length - 2 && t > SKY_KEYS[i + 1][0]) i++;
  const [t0, top0, hz0] = SKY_KEYS[i], [t1, top1, hz1] = SKY_KEYS[i + 1];
  const k = clamp((t - t0) / (t1 - t0), 0, 1);
  const storm = G.gale * 0.55 * (1 - nightness() * 0.6); // storms gray out the day more than the night
  return [mix(mix(top0, top1, k), STORM[0], storm), mix(mix(hz0, hz1, k), STORM[1], storm)];
}

function drawSky() {
  const g = G.gale, t = dayClock(), night = nightness();
  const [top, horizon] = skyColors();
  const sky = ctx.createLinearGradient(0, 0, 0, waterY);
  sky.addColorStop(0, rgb(top));
  sky.addColorStop(1, rgb(horizon));
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, waterY + 40);
  // Stars and a moon once it's dark.
  if (night > 0) {
    for (const st of STARS) {
      ctx.fillStyle = `rgba(255, 255, 240, ${night * (0.45 + 0.4 * Math.sin(G.t * 2 + st.ph))})`;
      ctx.beginPath(); ctx.arc(st.x * W, st.y * waterY, st.r, 0, Math.PI * 2); ctx.fill();
    }
    const mx = W * 0.24, my = Math.max(90 / scale, waterY - 330);
    ctx.fillStyle = `rgba(245, 240, 220, ${night})`;
    ctx.beginPath(); ctx.arc(mx, my, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(top, night); // bite out a crescent
    ctx.beginPath(); ctx.arc(mx + 7, my - 4, 14, 0, Math.PI * 2); ctx.fill();
  }
  // The sun sinks toward the horizon and sets just before dusk.
  if (t < 0.78) {
    const sx = W * 0.8, sy = lerp(Math.max(90 / scale, waterY - 330), waterY + 20, t / 0.76);
    const warm = clamp(t / 0.62, 0, 1);
    const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 90);
    const a = (1 - g * 0.65) * (t > 0.7 ? 1 - (t - 0.7) / 0.08 : 1);
    glow.addColorStop(0, `rgba(255, ${Math.round(lerp(244, 170, warm))}, ${Math.round(lerp(214, 110, warm))}, ${0.95 * a})`);
    glow.addColorStop(0.25, `rgba(255, ${Math.round(lerp(236, 150, warm))}, ${Math.round(lerp(200, 100, warm))}, ${0.5 * a})`);
    glow.addColorStop(1, 'rgba(255, 180, 120, 0)');
    ctx.fillStyle = glow; ctx.fillRect(sx - 90, sy - 90, 180, 180);
  }
  const cloud = mix(mix([226, 230, 234], horizon, 0.35), [60, 64, 84], night * 0.7);
  for (const c of CLOUDS) {
    const x = ((c.x % (W + 400)) + W + 400) % (W + 400) - 200;
    const y = 30 + c.y * (waterY - 60);
    ctx.fillStyle = rgb(mix(cloud, [120, 128, 138], g * 0.5), 0.55);
    ctx.beginPath();
    ctx.ellipse(x, y, c.w * 0.5, 18, 0, 0, Math.PI * 2);
    ctx.ellipse(x - c.w * 0.2, y - 10, c.w * 0.25, 16, 0, 0, Math.PI * 2);
    ctx.ellipse(x + c.w * 0.18, y - 8, c.w * 0.22, 14, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // Far horizon: the distant Canadian shore.
  ctx.fillStyle = rgb(mix([60, 76, 88], [24, 30, 46], nightness()), 0.6);
  ctx.beginPath(); ctx.moveTo(W * 0.35, waterY - 4);
  for (let x = W * 0.35; x <= W + 20; x += 40) ctx.lineTo(x, waterY - 10 - Math.sin(x * 0.013) * 5 - Math.sin(x * 0.041) * 3);
  ctx.lineTo(W + 20, waterY); ctx.lineTo(W * 0.35, waterY); ctx.fill();
  for (const f of G.flakes) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); }
}

// The town Christmas is trying to reach. Its houses light up as creep rises.
function drawShore() {
  const base = waterY + 6;
  ctx.fillStyle = '#3a3f36';
  // Flat cliff top out to x = SHORE_X - 4, then down to the water.
  ctx.beginPath(); ctx.moveTo(-20, H); ctx.lineTo(-20, base - 40); ctx.lineTo(SHORE_X - 4, base - 34);
  ctx.quadraticCurveTo(SHORE_X + 14, base - 28, SHORE_X + 18, base + 30); ctx.lineTo(SHORE_X + 18, H); ctx.fill();
  // Pines
  ctx.fillStyle = '#23302a';
  for (let i = 0; i < 5; i++) {
    const x = 4 + i * 14, h = 34 + (i % 2) * 10;
    ctx.beginPath(); ctx.moveTo(x, base - 36 - h); ctx.lineTo(x - 9, base - 36); ctx.lineTo(x + 9, base - 36); ctx.fill();
  }
  // Houses
  const lit = G.creep / 100;
  [[0, 22, '#6b5847'], [18, 18, '#7d6b5a'], [35, 24, '#5e5148']].forEach(([x, h, c], i) => {
    const y = base - 36 - h;
    ctx.fillStyle = c; ctx.fillRect(x, y, 16, h);
    ctx.fillStyle = '#2f2a28'; ctx.beginPath(); ctx.moveTo(x - 3, y); ctx.lineTo(x + 8, y - 9); ctx.lineTo(x + 19, y); ctx.fill();
    ctx.fillStyle = '#ffd98a'; ctx.fillRect(x + 5, y + 6, 6, 5);
    if (lit > (i + 0.5) / 3.5) { // Christmas lights. Too early. Ugh.
      for (let k = 0; k < 5; k++) {
        ctx.fillStyle = CONFETTI[(k + Math.floor(G.t * 3)) % 4];
        ctx.beginPath(); ctx.arc(x + k * 4, y - 7 + Math.abs(k - 2) * 2.4, 1.6, 0, Math.PI * 2); ctx.fill();
      }
    }
  });
  // Lighthouse with a sweeping beam, brighter after dark.
  const lx = SHORE_X - 14, ly = base - 34;
  const beam = Math.sin(G.t * 1.4);
  ctx.fillStyle = `rgba(255, 240, 180, ${0.05 + 0.06 * Math.abs(beam) + nightness() * 0.12})`;
  ctx.beginPath(); ctx.moveTo(lx, ly - 46); ctx.lineTo(lx + 240, ly - 46 - 28 + beam * 24); ctx.lineTo(lx + 240, ly - 46 + 28 + beam * 24); ctx.fill();
  ctx.fillStyle = '#efe9dc'; ctx.beginPath(); ctx.moveTo(lx - 8, ly); ctx.lineTo(lx - 5, ly - 40); ctx.lineTo(lx + 5, ly - 40); ctx.lineTo(lx + 8, ly); ctx.fill();
  ctx.fillStyle = '#b3261e'; ctx.fillRect(lx - 6, ly - 28, 12, 6); ctx.fillRect(lx - 6, ly - 52, 12, 6);
  ctx.fillStyle = '#ffe9a6'; ctx.fillRect(lx - 4, ly - 46, 8, 6);
}

function drawWater() {
  const night = nightness(), [, horizon] = skyColors();
  const grad = ctx.createLinearGradient(0, waterY - 30, 0, H);
  grad.addColorStop(0, rgb(mix(mix([44, 92, 108], horizon, 0.18), [16, 34, 52], night * 0.8), 0.93));
  grad.addColorStop(1, rgb(mix([10, 30, 40], [4, 10, 20], night), 0.98));
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.moveTo(SHORE_X + 10, H + 20);
  const pts = [];
  for (let x = SHORE_X + 10; x <= W + 10; x += 8) { const y = surf(x); pts.push([x, y]); ctx.lineTo(x, y); }
  ctx.lineTo(W + 10, H + 20); ctx.fill();
  // Foam on the surface line and on crests.
  ctx.strokeStyle = 'rgba(230, 245, 250, .55)'; ctx.lineWidth = 2;
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
  ctx.fillStyle = 'rgba(240, 250, 255, .7)';
  for (let i = 1; i < pts.length - 1; i++) {
    const [x, y] = pts[i];
    if (y < pts[i - 1][1] && y <= pts[i + 1][1] && y < waterY - 5) {
      ctx.beginPath(); ctx.ellipse(x, y + 1, 9, 3, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawShip() {
  ctx.save();
  ctx.translate(ship.x, ship.y); ctx.rotate(ship.ang);
  const L = ship.L, h = L / 2;
  // Hull: dark red, black at the waterline, raked bow on the right.
  ctx.fillStyle = '#7d1d1a';
  ctx.beginPath(); ctx.moveTo(-h, -22); ctx.lineTo(h - 6, -26); ctx.lineTo(h + 8, -26); ctx.lineTo(h - 6, 16); ctx.lineTo(-h + 10, 16);
  ctx.quadraticCurveTo(-h - 4, 10, -h, -22); ctx.fill();
  ctx.fillStyle = '#1b1b1b';
  ctx.beginPath(); ctx.moveTo(-h + 1, 2); ctx.lineTo(h + 1, 2); ctx.lineTo(h - 6, 16); ctx.lineTo(-h + 10, 16); ctx.quadraticCurveTo(-h - 2, 12, -h + 1, 2); ctx.fill();
  ctx.fillStyle = '#e9e4d8'; ctx.font = "9px Bungee, sans-serif"; ctx.textAlign = 'right';
  ctx.fillText('S.S. NOVEMBER', h - 14, -9);
  // Deck and hatch covers.
  ctx.fillStyle = '#5a5f63'; ctx.fillRect(-h + 4, -27, L - 10, 5);
  ctx.fillStyle = '#8a9096';
  for (let x = -h + 82; x < h - 70; x += 17) ctx.fillRect(x, -31, 12, 4);
  // Stern engine house and stack.
  ctx.fillStyle = '#efe9dc'; ctx.fillRect(-h + 8, -56, 66, 30);
  const win = nightness() > 0.25 ? '#ffd98a' : '#2b3a4a'; // lights on after dark
  ctx.fillStyle = win; for (let x = -h + 14; x < -h + 70; x += 11) ctx.fillRect(x, -50, 7, 6);
  ctx.fillStyle = '#1b1b1b'; ctx.fillRect(-h + 28, -84, 20, 30);
  ctx.fillStyle = '#e8b64c'; ctx.fillRect(-h + 28, -76, 20, 6);
  // Forward pilothouse, stacked up at the bow like a real laker.
  ctx.fillStyle = '#efe9dc'; ctx.fillRect(h - 58, -52, 46, 26); ctx.fillRect(h - 50, -68, 34, 16);
  ctx.fillStyle = win; ctx.fillRect(h - 48, -64, 30, 6);
  for (let x = h - 54; x < h - 16; x += 10) ctx.fillRect(x, -46, 6, 5);
  ctx.strokeStyle = '#efe9dc'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(h - 34, -68); ctx.lineTo(h - 34, -86); ctx.stroke();
  // Cannons on deck.
  turretSpots().forEach((lx, i) => {
    ctx.save(); ctx.translate(lx, -36);
    ctx.rotate((ship.aims[i] || -1.2) - ship.ang);
    ctx.fillStyle = '#3d4246'; ctx.fillRect(0, -4, 22, 8);
    ctx.restore();
    ctx.fillStyle = '#5c6268'; ctx.beginPath(); ctx.arc(lx, -34, 9, Math.PI, 0); ctx.fill();
  });
  if (ship.flash > 0 || (G.iframes > 0 && Math.floor(G.t * 20) % 2)) {
    // Tint just the boat's own shapes white, not a box around it.
    ctx.globalAlpha = Math.max(ship.flash, 0.25) * 0.6; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-h, -22); ctx.lineTo(h + 8, -26); ctx.lineTo(h - 6, 16); ctx.lineTo(-h + 10, 16);
    ctx.quadraticCurveTo(-h - 4, 10, -h, -22); ctx.fill();
    ctx.fillRect(-h + 8, -56, 66, 30); ctx.fillRect(-h + 28, -84, 20, 30);
    ctx.fillRect(h - 58, -52, 46, 26); ctx.fillRect(h - 50, -68, 34, 16);
    ctx.globalAlpha = 1;
  }
  if (G.ope) {
    ctx.strokeStyle = 'rgba(154, 209, 255, .8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, -30, h + 24, 72, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

/** The dashed ring showing how far the cannons reach. */
function drawRange() {
  const c = shipPoint(0, -40);
  const pulse = G.coachRing ? 0.35 + 0.25 * Math.sin(G.t * 6) : 0.16;
  ctx.save();
  ctx.setLineDash([10, 10]); ctx.lineDashOffset = -G.t * 20;
  ctx.strokeStyle = `rgba(255, 233, 166, ${pulse})`; ctx.lineWidth = G.coachRing ? 3 : 2;
  ctx.beginPath(); ctx.arc(c.x, c.y, CANNON.range, Math.PI, 0); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  KINDS[e.kind].draw(e);
  if (e.hitT > 0) { // white blink when hit
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }
}

function drawSanta(x, y, s, wob, chute) {
  ctx.save(); ctx.translate(x, y);
  ctx.scale(s * (1 + wob * 0.12 * Math.sin(G.t * 40)), s * (1 - wob * 0.1 * Math.sin(G.t * 40)));
  if (chute) {
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-14, -26); ctx.lineTo(-30, -66); ctx.moveTo(14, -26); ctx.lineTo(30, -66); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = i % 2 ? '#fff' : '#2a9d8f';
      ctx.beginPath(); ctx.moveTo(0, -66); ctx.arc(0, -66, 34, Math.PI + i * Math.PI / 4, Math.PI + (i + 1) * Math.PI / 4); ctx.fill();
    }
  }
  ctx.fillStyle = '#d62828'; ctx.beginPath(); ctx.ellipse(0, 0, 21, 24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-22, -4 + Math.sin(G.t * 5 + x) * 3, 7, 12, 0.5, 0, Math.PI * 2); ctx.ellipse(22, -4 - Math.sin(G.t * 5 + x) * 3, 7, 12, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1b1b1b'; ctx.fillRect(-21, 3, 42, 6);
  ctx.fillStyle = '#ffd166'; ctx.fillRect(-4, 2, 8, 8);
  ctx.fillStyle = '#f4c7a1'; ctx.beginPath(); ctx.arc(0, -28, 11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, -20, 12, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(-4, -30, 1.6, 0, Math.PI * 2); ctx.arc(4, -30, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d62828'; ctx.beginPath(); ctx.moveTo(-12, -34); ctx.lineTo(12, -34); ctx.lineTo(15, -50); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-13, -37, 26, 5); ctx.beginPath(); ctx.arc(15, -50, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-9, -8, 4, 9, 0.4, 0, Math.PI * 2); ctx.fill(); // vinyl shine
  ctx.restore();
}

function drawBoss(b) {
  const s = b.s * 4.2;
  ctx.save();
  if (!b.flying && !b.dying) { // guy ropes, like a real lawn inflatable
    ctx.strokeStyle = 'rgba(240,240,240,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x - 60 * b.s, b.y - 120 * b.s); ctx.lineTo(b.x - 150, surf(b.x - 150));
    ctx.moveTo(b.x + 60 * b.s, b.y - 120 * b.s); ctx.lineTo(b.x + 140, surf(b.x + 140)); ctx.stroke();
  }
  drawSanta(b.x, b.y - 140 * b.s, s, b.hitT > 0 ? 0.6 : 0.15, false);
  if (b.rise >= 1 && !b.dying && Math.sin(b.t * 1.3) > 0.85) {
    ctx.font = "18px Bungee, sans-serif"; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(b.flying ? 'PFFFFFT' : 'HO HO HO', b.x - 20, b.y - 300 * b.s);
  }
  if (b.hitT > 0) { const c = bossCenter(b); ctx.globalAlpha = 0.25; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.restore();
}

function drawReindeer(x, y, ph) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#8b5a2b';
  ctx.beginPath(); ctx.ellipse(0, 0, 18, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-19, -9, 7, 5, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-13, -4); ctx.lineTo(-17, -9); ctx.stroke();
  for (let i = 0; i < 4; i++) { // galloping legs
    const lx = -10 + i * 7, sw = Math.sin(ph + i * 1.6) * 5;
    ctx.beginPath(); ctx.moveTo(lx, 6); ctx.lineTo(lx + sw, 16); ctx.stroke();
  }
  ctx.strokeStyle = '#d9c7a3'; ctx.lineWidth = 2; // antlers
  ctx.beginPath(); ctx.moveTo(-20, -13); ctx.lineTo(-24, -24); ctx.lineTo(-28, -26); ctx.moveTo(-23, -21); ctx.lineTo(-19, -25);
  ctx.moveTo(-17, -13); ctx.lineTo(-15, -23); ctx.lineTo(-11, -26); ctx.stroke();
  ctx.fillStyle = '#3b2412'; ctx.beginPath(); ctx.arc(-25, -9, 2.5, 0, Math.PI * 2); ctx.fill(); // plain brown nose
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(18, -3, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#b3261e'; ctx.fillRect(-6, -10, 12, 5); // tiny saddle
  ctx.restore();
}

function drawElfSki(x, y, slope) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(slope);
  ctx.fillStyle = '#e63946';
  ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(18, 0); ctx.quadraticCurveTo(24, 6, 14, 9); ctx.lineTo(-16, 9); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-12, 2, 22, 2);
  ctx.fillStyle = '#2a9d8f'; ctx.fillRect(-6, -14, 10, 14);
  ctx.fillStyle = '#f4c7a1'; ctx.beginPath(); ctx.arc(-1, -19, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a9d8f'; ctx.beginPath(); ctx.moveTo(-7, -22); ctx.lineTo(5, -22); ctx.lineTo(10, -34); ctx.fill();
  ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(10, -34, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(-16, -6); ctx.stroke();
  ctx.restore();
}

function drawDeckElf(x, y, ang, swimming) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  if (!swimming) { ctx.fillStyle = '#2a9d8f'; ctx.fillRect(-6, -2, 12, 12); }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, -3, 8, 3, 0, 0, Math.PI * 2); ctx.fill(); // collar
  ctx.fillStyle = '#f4c7a1'; ctx.beginPath(); ctx.arc(0, -10, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-2.5, -11, 2.4, 0, Math.PI * 2); ctx.arc(2.5, -11, 2.4, 0, Math.PI * 2); ctx.fill();
  const look = Math.sin(G.t * 0.7) * 1.2; // shifty, sideways eyes
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-2.5 + look, -11, 1.2, 0, Math.PI * 2); ctx.arc(2.5 + look, -11, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a9d8f'; ctx.beginPath(); ctx.moveTo(-8, -14); ctx.lineTo(8, -14); ctx.lineTo(0, -28); ctx.fill();
  ctx.restore();
}

function drawLatte(x, y) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-11, -12); ctx.lineTo(11, -12); ctx.lineTo(8, 14); ctx.lineTo(-8, 14); ctx.fill();
  ctx.fillStyle = '#d62828'; ctx.fillRect(-10, -3, 20, 9);
  ctx.fillStyle = '#fff'; for (let i = -8; i < 10; i += 6) ctx.fillRect(i, -3, 2, 9);
  ctx.fillStyle = '#6b4226'; ctx.fillRect(-13, -16, 26, 5);
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
  for (let i = 0; i < 2; i++) {
    const sx = -4 + i * 8, w = Math.sin(G.t * 4 + i) * 3;
    ctx.beginPath(); ctx.moveTo(sx, -19); ctx.quadraticCurveTo(sx + w, -25, sx, -31); ctx.stroke();
  }
  ctx.restore();
}

function drawPickup(p) {
  ctx.save(); ctx.translate(p.x, p.y + Math.sin(p.t * 4) * 1.5);
  if (p.kind === 'pasty') {
    ctx.fillStyle = '#d9a556'; ctx.beginPath(); ctx.arc(0, 0, 12, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b07a35'; for (let a = 0; a <= 6; a++) { ctx.beginPath(); ctx.arc(Math.cos(Math.PI + a * Math.PI / 6) * 11, Math.sin(Math.PI + a * Math.PI / 6) * 11, 2.2, 0, Math.PI * 2); ctx.fill(); }
  } else if (p.kind === 'thermos') {
    ctx.fillStyle = '#b3261e'; ctx.fillRect(-6, -16, 12, 22);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-6, -10, 12, 3); ctx.fillRect(-6, -2, 12, 3); ctx.fillRect(-2, -16, 3, 22);
    ctx.fillStyle = '#9aa1a6'; ctx.fillRect(-5, -21, 10, 5);
  } else {
    ctx.strokeStyle = '#9ad1ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -6, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#9ad1ff'; ctx.font = "10px Bungee, sans-serif"; ctx.textAlign = 'center'; ctx.fillText('OPE', 0, -2);
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of G.parts) {
    const a = 1 - p.t / p.life;
    if (p.kind === 'confetti') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = a; ctx.fillStyle = p.c;
      ctx.fillRect(-p.r, -p.r * 0.5, p.r * 2, p.r); ctx.restore();
    } else if (p.kind === 'smoke') {
      ctx.globalAlpha = a * 0.35; ctx.fillStyle = '#d0d4d8'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha = a; ctx.fillStyle = p.kind === 'glitter' ? p.c : '#e8f6fb';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/** Draw one enemy kind into a small image for the briefing card. */
function previewImg(kind) {
  if (!KINDS[kind] && kind !== 'boss' && kind !== 'gale') return '';
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const pctx = c.getContext('2d');
  const prev = ctx;
  ctx = pctx;
  try {
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    if (kind === 'boss' || kind === 'santa') drawSanta(32, 44, 0.78, 0, false);
    else if (kind === 'gale') {
      ctx.strokeStyle = '#cfe8f0'; ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(6, 20 + i * 12); ctx.bezierCurveTo(20, 10 + i * 12, 40, 30 + i * 12, 58, 18 + i * 12); ctx.stroke(); }
    } else {
      const e = { id: 1, x: 32, y: kind === 'santa' ? 40 : 34, rot: -0.3, vx: 0, attached: false, swim: false, floating: true, wob: 0 };
      if (kind === 'elfski') drawElfSki(32, 40, 0);
      else KINDS[kind].draw(e);
    }
  } catch (err) { /* previews are decoration; never block the card */ }
  ctx = prev;
  return c.toDataURL();
}

/* =====================  7. INPUT AND MAIN LOOP  ===================== */

function toWorldX(clientX) { return clientX / scale; }

canvas.addEventListener('pointerdown', e => {
  Audio.init();
  if (G.state !== 'play') return;
  pointer.active = true; pointer.x = toWorldX(e.clientX);
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => { if (pointer.active) pointer.x = toWorldX(e.clientX); });
['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, () => { pointer.active = false; }));

$('hornBtn').addEventListener('pointerdown', e => { e.preventDefault(); Audio.init(); blowHorn(); });
$('pauseBtn').addEventListener('click', () => pause());

const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
window.addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  else if ((e.code === 'Space' || e.code === 'KeyH' || e.code === 'ArrowUp') && G.state === 'play') { e.preventDefault(); Audio.init(); blowHorn(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (G.state === 'play') pause(); else if (G.state === 'paused') setState('play'); }
  else if (e.code === 'KeyM') Audio.setMuted(!Audio.muted);
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { keys.left = keys.right = false; pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  // The lake keeps moving behind the cards; the game only runs while playing.
  const live = G.state === 'play';
  G.t += dt;
  G.shake = Math.max(0, G.shake - dt * 30);
  for (let i = 0; i < SPEED; i++) {
    if (i) G.t += dt;
    updateWaves(dt);
    if (G.state === 'play') updatePlay(dt);
    else updateShip(dt);
  }
  updateParticles(dt);
  draw();
  if (live) updateHud();
  Music.tick();
}

G.up = freshUpgrades();
G.stats = { pops: 0, horns: 0, creepTotal: 0, start: performance.now() };
ship.x = W * 0.42;
showTitle();
requestAnimationFrame(frame);
if (DEBUG) window.__fitz = { G, ship, KINDS, spawnEnemy, finishDay, damageBoss, BOSS_HP };
</script>
