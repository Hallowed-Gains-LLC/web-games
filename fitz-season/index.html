<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fitz Season: It Ain't Christmas Yet</title>
<meta name="description" content="A six-minute game about a boat. Captain a Lake Superior freighter and hold back Christmas until November is over.">
<meta name="theme-color" content="#1d2733">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%A2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* November palette: slate sky, cold lake, flannel red. Christmas is the
     garish stuff that doesn't belong yet. */
  :root {
    --slate: #1d2733;
    --slate-2: #2b3846;
    --ink: #f3efe6;
    --muted: #b9c2c9;
    --flannel: #b3261e;
    --flannel-dark: #5c1410;
    --gold: #e8b64c;
    --mint: #6fd3a6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--slate); }
  body {
    font-family: 'Nunito', system-ui, sans-serif; font-weight: 600;
    color: var(--ink); user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px;
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    pointer-events: none; z-index: 5;
  }
  #hud[hidden], #controls[hidden] { display: none; }
  .pill {
    background: rgba(13, 20, 28, .72); border: 2px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 4px 12px; font-family: 'Bungee', sans-serif;
    font-size: 15px; letter-spacing: .5px; white-space: nowrap; position: relative; overflow: hidden;
  }
  #datePill i { /* day progress, filled behind the date text */
    position: absolute; inset: 0 auto 0 0; width: var(--p, 0%);
    background: rgba(232, 182, 76, .28); z-index: -1;
  }
  .meter { display: flex; align-items: center; gap: 6px; }
  .meter .label { font-family: 'Bungee', sans-serif; font-size: 11px; color: var(--muted); }
  .bar {
    width: clamp(70px, 14vw, 150px); height: 13px; border-radius: 7px;
    background: rgba(13, 20, 28, .72); border: 2px solid rgba(255,255,255,.16); overflow: hidden;
  }
  .bar i { display: block; height: 100%; width: 100%; background: #d9534f; transition: width .15s; }
  #hullBar { background: linear-gradient(#f07167, #b3261e); }
  /* The creep meter is a candy cane, obviously. */
  #creepBar { background: repeating-linear-gradient(135deg, #e63946 0 8px, #fff 8px 16px); }
  #bossMeter[hidden] { display: none; }
  #bossBar { background: linear-gradient(#ff8fa3, #c9184a); }
  #scorePill { margin-left: auto; }
  @media (max-width: 720px) { #dadPill { display: none; } }
  #dadPill { font-size: 11px; font-family: 'Nunito', sans-serif; font-weight: 800; color: var(--muted); }

  /* ---------- Touch controls ---------- */
  #controls { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  #hornBtn {
    position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 92px; height: 92px; border-radius: 50%; pointer-events: auto;
    border: 3px solid rgba(255,255,255,.25); font-family: 'Bungee', sans-serif; font-size: 14px;
    /* --charge (0..1) fills the ring as the horn charges */
    background:
      radial-gradient(circle at center, rgba(13,20,28,.9) 58%, transparent 59%),
      conic-gradient(var(--gold) calc(var(--charge, 0) * 360deg), rgba(255,255,255,.12) 0);
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  #hornBtn.ready { animation: pulse 0.9s ease-in-out infinite; color: var(--gold); }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  /* In the HUD row, after the score, so it can never cover anything. */
  #pauseBtn {
    pointer-events: auto; width: 38px; height: 32px; border-radius: 10px; font-family: 'Bungee', sans-serif;
    background: rgba(13,20,28,.72); border: 2px solid rgba(255,255,255,.18); padding: 0;
  }
  /* Day-one coaching hints, just under the HUD. */
  #coach {
    position: fixed; top: calc(max(10px, env(safe-area-inset-top)) + 58px); left: 50%; z-index: 6;
    transform: translate(-50%, -6px); width: max-content; max-width: min(520px, calc(100vw - 24px));
    padding: 9px 14px; border-radius: 12px; background: rgba(232, 182, 76, .96); color: #1d2733;
    font-family: 'Bungee', sans-serif; font-size: 14px; line-height: 1.35; text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none;
  }
  #coach.show { opacity: 1; transform: translate(-50%, 0); }
  #radio {
    position: fixed; left: 12px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 6;
    max-width: min(460px, calc(100vw - 140px)); padding: 8px 12px; border-radius: 12px;
    background: rgba(13,20,28,.8); border-left: 4px solid var(--gold);
    font-size: 14px; opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s;
    pointer-events: none;
  }
  #radio.show { opacity: 1; transform: none; }
  #radio b { font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 12px; color: var(--gold); margin-right: 6px; }

  /* ---------- Cards (title, day briefings, results) ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(10, 15, 22, .45); overflow-y: auto;
  }
  #overlay[hidden] { display: none; }
  .card {
    width: min(560px, 100%); margin: auto; padding: 22px 22px 18px; border-radius: 18px;
    background: var(--slate-2);
    /* flannel trim */
    border: 6px solid transparent;
    background-image:
      linear-gradient(var(--slate-2), var(--slate-2)),
      repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 4px, transparent 4px 12px),
      repeating-linear-gradient(90deg, var(--flannel) 0 12px, var(--flannel-dark) 12px 24px);
    background-origin: border-box; background-clip: padding-box, border-box, border-box;
    box-shadow: 0 18px 50px rgba(0,0,0,.5); text-align: center;
  }
  .card h1, .card h2, .card h3 { font-family: 'Bungee', sans-serif; font-weight: 400; margin: 0; line-height: 1.1; }
  .card h1 { font-size: clamp(38px, 9vw, 58px); color: var(--ink); text-shadow: 0 4px 0 var(--flannel-dark); }
  .card h2 { font-size: clamp(24px, 6vw, 34px); }
  .card h3 { font-size: 15px; color: var(--gold); margin-top: 14px; }
  .card p { margin: 8px 0; line-height: 1.45; }
  .sub { font-family: 'Bungee', sans-serif; color: var(--gold); font-size: clamp(16px, 4vw, 20px); margin-top: 6px !important; }
  .tag { color: var(--muted); font-style: italic; }
  .date { font-family: 'Bungee', sans-serif; color: var(--gold); font-size: 14px; letter-spacing: 1px; }
  .muted { color: var(--muted); font-size: 14px; }
  .btn {
    display: inline-block; margin: 6px 4px; padding: 11px 20px; border-radius: 12px; border: 0;
    background: var(--flannel); font-family: 'Bungee', sans-serif; font-size: 17px; color: #fff;
    box-shadow: 0 4px 0 var(--flannel-dark); text-decoration: none;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--flannel-dark); }
  .btn.ghost { background: rgba(255,255,255,.1); box-shadow: none; font-size: 14px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px; }
  a { color: var(--muted); }
  .threat {
    display: flex; gap: 12px; align-items: center; text-align: left; margin: 12px 0;
    background: rgba(0,0,0,.22); border-radius: 12px; padding: 10px;
  }
  .threat img { width: 64px; height: 64px; flex-shrink: 0; }
  .threat b { font-family: 'Bungee', sans-serif; font-weight: 400; color: var(--mint); }
  .chat { text-align: left; background: rgba(0,0,0,.22); border-radius: 12px; padding: 8px 12px; margin: 10px 0; font-size: 14px; }
  .chat div { margin: 3px 0; }
  .chat b { font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 11px; color: var(--gold); margin-right: 6px; }
  .fact { font-size: 14px; color: var(--muted); }
  .fact::before { content: '⚓ '; }
  .upgrades { display: grid; gap: 8px; margin-top: 8px; }
  .upgrade {
    text-align: left; padding: 10px 12px; border-radius: 12px; border: 2px solid rgba(255,255,255,.14);
    background: rgba(0,0,0,.25);
  }
  .upgrade:hover, .upgrade:focus-visible { border-color: var(--gold); outline: none; }
  .upgrade b { display: block; font-family: 'Bungee', sans-serif; font-weight: 400; color: var(--gold); }
  .upgrade span { font-size: 14px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; text-align: left; max-width: 300px; margin: 12px auto; }
  .stats span:nth-child(even) { font-family: 'Bungee', sans-serif; text-align: right; }
  .how { text-align: left; }
  .how li { margin: 6px 0; }
  .memorial { background: #11161d; }
  .memorial p { font-size: 16px; }
  .rotate { font-size: 13px; color: var(--gold); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="pill" id="datePill"><i></i><span id="dateText">NOV 1</span></div>
  <div class="meter"><span class="label">HULL</span><div class="bar"><i id="hullBar"></i></div></div>
  <div class="meter"><span class="label">CHRISTMAS CREEP</span><div class="bar"><i id="creepBar" style="width:0"></i></div></div>
  <div class="meter" id="bossMeter" hidden><span class="label">INFLATABLE</span><div class="bar"><i id="bossBar"></i></div></div>
  <div class="pill" id="dadPill">📻 Dad played the song 0×</div>
  <div class="pill" id="scorePill">0</div>
  <button id="pauseBtn" aria-label="Pause">II</button>
</div>

<div id="controls" hidden>
  <button id="hornBtn" aria-label="Blow the horn">HORN</button>
</div>
<div id="radio"></div>
<div id="coach"></div>

<div id="overlay"><div class="card" id="card"></div></div>

<script>
'use strict';
/* ==========================================================================
   FITZ SEASON: It Ain't Christmas Yet
   --------------------------------------------------------------------------
   A six-minute game about a boat, riffing on the internet's yearly
   "Fitz season" memes: the stretch between Halloween and November 10 when
   everyone remembers the Edmund Fitzgerald (and Gordon Lightfoot's song)
   and Christmas is NOT allowed to start early.

   You captain the S.S. November, a fictional Lake Superior freighter. Your
   taconite cannons fire on their own; you steer, ride the waves, and blow
   the horn. Hold back Christmas from November 1 to 9, then beat the boss.

   Respect rules this game follows on purpose:
     - The real ship, its crew and the wreck are never shown or joked about.
       Nobody dies: losing means heading back to port, or Christmas winning.
     - No song lyrics or melody. All music is original, plus "Jingle Bells",
       which is public domain.
     - November 10 gets a short, sincere tribute instead of a level.

   Layout of this file:
     1. Setup: canvas, saves, helpers
     2. Content: days, enemies, upgrades, writing
     3. Audio: tiny Web Audio synth + music
     4. World: waves, ship, enemies, pickups, particles
     5. Game flow: days, cards, failing, winning
     6. Drawing
     7. Input and main loop
   ========================================================================== */

/* =====================  1. SETUP  ===================== */

const $ = id => document.getElementById(id);
const canvas = $('game');
const mainCtx = canvas.getContext('2d');
let ctx = mainCtx; // swapped briefly to draw enemy previews for the cards

// Saves are prefixed with fitz_ because every game on the site shares one
// localStorage (see the repo README).
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem('fitz_' + key); return v === null ? fallback : v; }
    catch (e) { return fallback; }
  },
  set(key, value) { try { localStorage.setItem('fitz_' + key, String(value)); } catch (e) { /* private mode */ } },
};

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const lerp = (a, b, t) => a + (b - a) * t;

/** Pick a key from {key: weight}. */
function weighted(weights) {
  let total = 0;
  for (const k in weights) total += weights[k];
  let r = Math.random() * total;
  for (const k in weights) { r -= weights[k]; if (r <= 0) return k; }
  return Object.keys(weights)[0];
}

// The world is measured in "units": about 900 x 560 of them fill the screen
// at scale 1, and wider or taller screens just see more sky and lake.
let W = 960, H = 540, scale = 1, dpr = 1, waterY = 400;
const SHORE_X = 70; // the town on the left; Christmas that gets past here counts as creep

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  // Landscape fits about 900 x 560 units. Portrait narrows the world so the
  // boat stays big, and (below) raises the waterline so the action sits in
  // the middle of the screen instead of under a mile of empty sky.
  const portrait = ch > cw;
  scale = Math.max(0.4, Math.min(cw / (portrait ? 700 : 900), ch / 560));
  W = cw / scale;
  H = ch / scale;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  waterY = portrait ? Math.round(H * 0.6) : H - clamp(H * 0.3, 140, 200);
  ship.L = W < 800 ? 250 : 300;
}
window.addEventListener('resize', resize);
// (resize() runs once `ship` exists, further down.)

/** Highest point enemies spawn at, kept clear of the HUD. */
const skyTop = () => Math.max(waterY - 400, 96 / scale);

const params = new URLSearchParams(location.search);
// No screen shake for people who've asked their device for less motion.
const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEBUG = params.has('debug');
// ?debug&speed=N runs the simulation N times faster (for balance testing).
const SPEED = DEBUG ? clamp(parseInt(params.get('speed'), 10) || 1, 1, 20) : 1;

/* =====================  2. CONTENT  ===================== */

// One entry per day of November. `mix` weights which decorations spawn;
// `rate` is spawns per second; `len` is seconds until midnight.
const ALL = { candy: 1, santa: 0.3, jingle: 0.4, reindeer: 0.25, elfski: 0.45, deckelf: 0.3, latte: 0.35 };
const DAYS = [
  null,
  { title: 'The Day After Halloween', blurb: "The jack-o'-lanterns aren't even cold yet, and the candy canes are already here.",
    intro: 'candy', mix: { candy: 1 }, rate: 1.25, len: 30, gale: 0.15 },
  { title: 'The Inflatables', blurb: "Somebody's twelve-foot inflatable Santa broke loose. Then all of them did.",
    intro: 'santa', mix: { candy: 1, santa: 0.4 }, rate: 1.4, len: 32, gale: 0.25 },
  { title: 'The Playlist', blurb: 'The mall turned on the music. It is November third.',
    intro: 'jingle', mix: { candy: 1, santa: 0.3, jingle: 0.6 }, rate: 1.6, len: 34, gale: 0.3 },
  { title: 'Air Support', blurb: 'Reindeer spotted over Duluth. They brought presents. The presents are not for you.',
    intro: 'reindeer', mix: { candy: 1, santa: 0.3, jingle: 0.45, reindeer: 0.35 }, rate: 1.75, len: 35, gale: 0.35 },
  { title: 'Elves on Watercraft', blurb: 'Turns out the North Pole has jet skis. Nobody is happy about this.',
    intro: 'elfski', mix: { candy: 0.9, santa: 0.3, jingle: 0.4, reindeer: 0.25, elfski: 0.55 }, rate: 1.9, len: 36, gale: 0.4 },
  { title: 'Surveillance Season', blurb: "Something just landed on the deck. It's watching. It's always watching.",
    intro: 'deckelf', mix: { candy: 0.9, santa: 0.3, jingle: 0.4, reindeer: 0.25, elfski: 0.45, deckelf: 0.4 }, rate: 2.0, len: 37, gale: 0.45 },
  { title: 'Seasonal Beverages', blurb: 'Peppermint everything. Already. On the seventh.',
    intro: 'latte', mix: { ...ALL, latte: 0.45 }, rate: 2.15, len: 38, gale: 0.5 },
  { title: 'The Gales of November', blurb: "They came early. They always come early. Lake Superior is in a mood, and it's not personal.",
    intro: 'gale', mix: ALL, rate: 2.3, len: 40, gale: 1 },
  { title: 'The Great Inflatable', blurb: "Somebody's forty-foot lawn Santa is standing in the lake. This is the last stand.",
    intro: 'boss', mix: { candy: 1, jingle: 0.25 }, rate: 0.8, len: 0, gale: 0.6, boss: true },
];
const LAST_DAY = DAYS.length - 1;

// Shown on each day's briefing card when that threat first appears.
const THREATS = {
  candy: ['Candy Canes', 'Fast, pointy, minty. Pop them before they reach shore.'],
  santa: ['Inflatable Santas', 'Tanky, floaty, deeply unsettling. They make a great pffffft.'],
  jingle: ['Mall Music', 'Homes in on your ears. Every one you pop plays a note.'],
  reindeer: ['Reindeer', 'Fly over and drop presents on your deck. Shoot the presents too.'],
  elfski: ['Jet-Ski Elves', 'Ride the waves and ram the boat. Very rude.'],
  deckelf: ['Elf on the Deck', 'Lands on your boat and stares. Your cannons get shy. Blow the horn to shoo it.'],
  latte: ['Seasonal Peppermint Beverage', 'Pop one and it splits into three peppermints.'],
  gale: ['Gale Warning', 'Huge waves, snow, and wind shoving everything toward shore all day. Ride the swells.'],
  boss: ['The Great Inflatable', 'Forty feet of nylon and holiday spirit. Pop it.'],
};

// Great Lakes group chat, one exchange per day. (The lakes have opinions.)
const LAKE_CHATS = [
  null,
  [['Lake Superior', "it's 36 degrees btw"], ['Lake Erie', 'im warm!! :)'], ['Lake Superior', 'nobody asked, erie']],
  [['Lake Huron', "hi, i'm also here"], ['Lake Michigan', 'did someone say something?']],
  [['Lake Michigan', "i'm basically an ocean"], ['Lake Superior', 'i could hold you, huron, erie and ontario and still have room. for three more eries.']],
  [['Lake Ontario', 'sorry, are we doing the christmas thing yet?'], ['Everyone', 'NO.']],
  [['Lake Erie', 'remember when that river caught fire'], ['Lake Superior', 'erie we have talked about this']],
  [['Lake Huron', 'fun fact i have 30,000 islands'], ['(nobody)', '...'], ['Lake Huron', 'ok']],
  [['Lake Superior', "i make my own weather. today's forecast: no."], ['Lake Ontario', 'sorry to hear that!']],
  [['Lake Superior', "not personal. it's just november."], ['Lake Erie', "she's like this every year"]],
  [['Lake Superior', 'there is a SANTA standing in me'], ['Lake Michigan', 'pop it pop it pop it']],
];

// Real, light facts about the lake and the boats. (Nothing about the wreck.)
const FACTS = [
  null,
  'Lake Superior holds about 10% of all the fresh surface water on Earth.',
  'Lake Superior is up to 1,333 feet deep: deeper than the Empire State Building is tall (not counting the antenna).',
  "Taconite pellets are marble-sized balls of iron ore. Lake freighters haul millions of them. Yours shoots them.",
  'Lake freighters greet each other with their horns: one long blast and two short ones is the master salute.',
  "The biggest lake freighters today are over 1,000 feet long. People call them thousand-footers.",
  'The Soo Locks lift ships about 21 feet between Lake Superior and Lake Huron.',
  "They say Lake Superior's shoreline, stretched out straight, would reach from Duluth to the Bahamas.",
  "Great Lakes sailors have long called November's storms the gales of November. Superior makes its own weather.",
  'Lake Superior has fully frozen over only a handful of times on record. It is very committed to being a lake.',
];

// Dad is on the CB radio. Dad has been playing the song since October 31st.
const DAD_LINES = [
  "Played the song again. That's {n} times today.",
  'Your mother says no boat song at dinner. I am playing it at dinner.',
  'Back in my day nobody decorated before Thanksgiving. Uphill. In the snow.',
  "I'm not crying. The lake's just extra wet today.",
  'Proud of you, kiddo. Now get off the radio, my song is on.',
  'Got the flannel. Got the coffee. Got the song on repeat. Most wonderful time of the year.',
  'If you see a Christmas tree before the tenth, you have my permission to honk.',
  "Played it {n} times. The dog left.",
  'Six-plus minutes of perfect storytelling. They do not make them like that anymore.',
  'The gales of November came early, kiddo. Christmas does not get to.',
];

// The radio at the bottom of the screen. Each entry is a conversation:
// lines play one after another, so replies land right after their setup.
// Pools unlock as the game goes (a threat's lines start on the day it shows
// up), and Radio.pick() won't repeat a conversation until its pool runs dry.
// Same rules as everywhere else in this game: no lyrics, and nothing about
// the real ship or crew.
const RADIO = {
  general: [
    [['Lake Superior', 'brr'], ['Lake Erie', "you're literally the coldest one"], ['Lake Superior', "i know. i'm bragging."]],
    [['Lake Erie', 'can i play?'], ['Lake Superior', "you're 210 feet deep at most. sit down."]],
    [['Lake Ontario', 'sorry!'], ['Deckhand', 'for what?'], ['Lake Ontario', 'just in general!']],
    [['Lake Huron', 'hello? anyone?'], ['Lake Huron', '...'], ['Lake Huron', 'i have a bay so big it has its own name, you know']],
    [['Lake Michigan', 'chicago says hi'], ['Lake Superior', 'tell chicago to stop calling you an ocean']],
    [['Lake Superior', "this is fine. i'm fine. it's 36 degrees."]],
    [['Cook', 'pasties are up!'], ['Deckhand', 'is it PASS-tee or PASTE-ee'], ['Cook', 'say it wrong one more time']],
    [['Deckhand', 'one of the elves waved at me'], ['Captain', "don't wave back."]],
    [['Deckhand', 'is it bad that i kinda like the candy canes'], ['Captain', 'yes.']],
    [['Coast Guard', 'S.S. November, please stop honking at the mall'], ['Coast Guard', "...they're asking nicely"]],
    [['Lake Erie', 'can i be the boss next year'], ['Lake Superior', 'no'], ['Lake Erie', "what if i'm really mean"], ['Lake Superior', 'still no']],
    [['Mall Santa', 'ho ho h-'], ['Everyone', 'NOT YET.']],
    [['Weather Radio', 'gale warning: november, arriving early, as usual']],
    [['Lake Superior', 'the gales of november come early. read a book.']],
    [['Dad', "that's {n}."], ['Mom', 'he means the song.'], ['Mom', 'he always means the song.']],
    [['Dad', 'kiddo, you ever notice how good a song gets when it runs six minutes'], ['Deckhand', 'is this about the boat song'], ['Dad', "it's always about the boat song"]],
    [['Soo Locks', 'friendly reminder: we close for the winter in january'], ['Lake Superior', "that's my favorite part"]],

const Audio = {
  ac: null, master: null, music: null, sfx: null, noiseBuf: null,
  muted: store.get('muted', '0') === '1',

  /** Browsers only allow audio after a tap, so this runs on the first one. */
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = this.muted ? 0 : 0.8;
    this.master.connect(this.ac.destination);
    this.music = this.ac.createGain(); this.music.gain.value = 0.2; this.music.connect(this.master);
    this.sfx = this.ac.createGain(); this.sfx.gain.value = 0.55; this.sfx.connect(this.master);
    const len = this.ac.sampleRate * 1.5;
    this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  setMuted(m) {
    this.muted = m;
    store.set('muted', m ? '1' : '0');
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.8, this.ac.currentTime, 0.05);
  },
  now() { return this.ac ? this.ac.currentTime : 0; },

  /** One synth note. `slide` bends the pitch to that frequency. */
  tone(freq, dur, o = {}) {
    if (!this.ac) return;
    const t = (o.when || this.now());
    const osc = this.ac.createOscillator();
    const g = this.ac.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + dur);
    if (o.detune) osc.detune.value = o.detune;
    const vol = o.vol == null ? 0.25 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.lowpass) {
      const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lowpass;
      osc.connect(f); node = f;
    }
    node.connect(g);
    g.connect(o.dest || this.sfx);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  /** A burst of filtered noise: splashes, pops, hisses. */
  noise(dur, o = {}) {
    if (!this.ac) return;
    const t = (o.when || this.now());
    const src = this.ac.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
    f.Q.value = o.q || 1;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(o.vol == null ? 0.3 : o.vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  },
};

// "Jingle Bells" (1857, public domain). Each Mall Music note you pop plays

const JINGLE = [64, 64, 64, 64, 64, 64, 64, 67, 60, 62, 64, 65, 65, 65, 65, 65, 64, 64, 64, 64, 62, 62, 64, 62, 67];
let jingleIdx = 0;
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function playJingleNote() {
  const f = midi(JINGLE[jingleIdx++ % JINGLE.length]);

}

// ----- Music: an original sea-shanty-ish jig in D dorian, 6/8 -----
// Each bar is six eighth notes: [midi note, length in eighths].
const SHANTY = [
  [[62, 2], [65, 1], [69, 2], [69, 1]], [[67, 1], [65, 1], [64, 1], [62, 3]],
  [[60, 2], [64, 1], [67, 2], [67, 1]], [[65, 1], [64, 1], [62, 1], [60, 3]],
  [[62, 2], [65, 1], [69, 2], [74, 1]], [[72, 1], [69, 1], [67, 1], [65, 2], [64, 1]],
  [[62, 1], [65, 1], [64, 1], [60, 2], [64, 1]], [[62, 6]],
  [[69, 2], [72, 1], [74, 2], [72, 1]], [[69, 1], [67, 1], [65, 1], [67, 3]],
  [[69, 2], [72, 1], [74, 2], [76, 1]], [[74, 1], [72, 1], [69, 1], [72, 3]],
  [[74, 2], [72, 1], [69, 2], [67, 1]], [[65, 1], [67, 1], [69, 1], [67, 2], [65, 1]],
  [[64, 1], [62, 1], [64, 1], [65, 2], [64, 1]], [[62, 6]],
];
// Two bass notes per bar (each three eighths long).
const BASS = [
  [50, 45], [43, 50], [48, 43], [41, 48], [50, 45], [41, 48], [50, 48], [50, 50],
  [41, 48], [48, 43], [41, 48], [48, 43], [50, 45], [41, 48], [48, 45], [50, 50],
];
// The mall speaker's version of Jingle Bells, for the boss's middle phase.
const MALL = [[64, 1], [64, 1], [64, 2], [64, 1], [64, 1], [64, 2], [64, 1], [67, 1], [60, 1.5], [62, 0.5], [64, 4]];

const Music = {
  on: false, bar: 0, next: 0, mall: false, mallNext: 0, mallIdx: 0, eighth: 0.19,
  start() { if (!Audio.ac) return; this.on = true; this.bar = 0; this.next = Audio.now() + 0.1; },
  stop() { this.on = false; this.mall = false; },
  /** Called every frame; schedules notes a little ahead so timing is steady. */
  tick() {
    if (!this.on || !Audio.ac) return;
    const ahead = Audio.now() + 0.2;
    while (this.next < ahead) {
      const b = this.bar % SHANTY.length;
      let t = this.next, e = this.eighth;
      for (const [note, len] of SHANTY[b]) {
        Audio.tone(midi(note), len * e * 0.95, { type: 'square', vol: 0.16, when: t, dest: Audio.music, lowpass: 2400 });
        t += len * e;
      }
      BASS[b].forEach((n, i) => Audio.tone(midi(n), 3 * e * 0.9, { type: 'triangle', vol: 0.32, when: this.next + i * 3 * e, dest: Audio.music }));
      for (let i = 0; i < 6; i++) { // a stompy little beat
        Audio.noise(0.05, { freq: i % 3 === 0 ? 180 : 5000, filter: i % 3 === 0 ? 'lowpass' : 'highpass',
          vol: i % 3 === 0 ? 0.35 : 0.05, when: this.next + i * e, dest: Audio.music });
      }
      this.next += 6 * e;
      this.bar++;
    }
    if (this.mall) {
      if (this.mallNext < Audio.now()) this.mallNext = Audio.now() + 0.05;
      while (this.mallNext < ahead) {
        const [n, len] = MALL[this.mallIdx++ % MALL.length];
        // Tinny, like a mall ceiling speaker.
        Audio.tone(midi(n + 12), len * 0.2 * 0.9, { type: 'sawtooth', vol: 0.07, when: this.mallNext, dest: Audio.music, lowpass: 1800 });
        this.mallNext += len * 0.2;
      }
    }
  },
};

// ----- Waves -----
// The surface is a few rolling sine waves plus "swells": big humps that
// travel toward shore. The horn calms everything for a moment.

/** Water surface height (screen y) at world x. */
function surf(x) {
  const g = G.gale, quiet = 1 - G.calm * 0.85, t = G.t;
  let y = waterY
    + Math.sin(x * 0.011 + t * 1.25) * (3 + 6 * g) * quiet
    + Math.sin(x * 0.026 - t * 2.0) * (1.5 + 3 * g) * quiet
    + Math.sin(x * 0.0045 + t * 0.55) * (2 + 6 * g) * quiet;
  for (const s of G.swells) {
    const d = (x - s.x) / s.w;
    if (d > -4 && d < 4) y -= s.a * Math.exp(-d * d) * quiet;
  }
  return y;
}

function updateWaves(dt) {
  G.calm = Math.max(0, G.calm - dt / 3);
  G.swellT -= dt;
  if (G.swellT <= 0) {
    const g = G.gale;
    G.swells.push({ x: W + 260, w: rand(70, 120), a: rand(8, 16) + g * rand(14, 30), v: rand(110, 150) + g * 50 });
    G.swellT = rand(3.5, 6.5) - g * 2.2;
  }
  for (const s of G.swells) s.x -= s.v * dt;
  G.swells = G.swells.filter(s => s.x > -400 && s.x < W + 600);
}

// ----- Ship -----
const keys = { left: false, right: false };
const pointer = { active: false, x: 0 };

function shipBounds() {
  const min = SHORE_X + ship.L / 2 + 10;
  let max = W - 24 - ship.L / 2;
  if (G.boss && !G.boss.flying) max = Math.min(max, G.boss.x - bossGap() - ship.L / 2);
  return [min, Math.max(min, max)];
}

function updateShip(dt) {
  let input = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (pointer.active) input = clamp((pointer.x - ship.x) / 45, -1, 1);
  const speed = 240 * G.up.speed;
  ship.vx += input * speed * 4 * dt;
  ship.vx *= Math.pow(0.12, dt); // big boat, lots of drag
  ship.vx = clamp(ship.vx, -speed, speed);
  ship.x += ship.vx * dt;
  const [min, max] = shipBounds();
  if (ship.x < min) { ship.x = min; ship.vx = 0; }
  if (ship.x > max) { ship.x = max; ship.vx = 0; }

  // Sit on the water: height from bow and stern, tilt from the difference.
  const span = ship.L * 0.42;
  const yBow = surf(ship.x + span), yStern = surf(ship.x - span), yMid = surf(ship.x);
  const targetY = (yBow + yStern + yMid * 2) / 4 + 2;
  const targetAng = Math.atan2(yBow - yStern, span * 2);
  ship.y = lerp(ship.y, targetY, Math.min(1, dt * 6));
  ship.ang = lerp(ship.ang, targetAng, Math.min(1, dt * 5));
  ship.flash = Math.max(0, ship.flash - dt * 4);

  // Smoke from the stack.
  if (Math.random() < dt * 8) {
    const p = shipPoint(-ship.L / 2 + 38, -82);
    G.parts.push({ kind: 'smoke', x: p.x, y: p.y, vx: -20 - G.wind * 0.6, vy: -18, life: 2.4, t: 0, r: rand(5, 9) });
  }
}

/** Ship-local point (x toward the bow, y down) to world coordinates. */
function shipPoint(lx, ly) {
  const c = Math.cos(ship.ang), s = Math.sin(ship.ang);
  return { x: ship.x + lx * c - ly * s, y: ship.y + lx * s + ly * c };
}
/** World point to ship-local coordinates. */
function toShip(x, y) {
  const c = Math.cos(-ship.ang), s = Math.sin(-ship.ang), dx = x - ship.x, dy = y - ship.y;
  return { x: dx * c - dy * s, y: dx * s + dy * c };
}
/** Does a circle at (x, y) with radius r touch the boat? */
function hitsShip(x, y, r) {
  const p = toShip(x, y), h = ship.L / 2;
  if (p.x < -h - r || p.x > h + r) return false;
  // Taller at the bow pilothouse and the stern engine house.
  const top = (p.x > h - 60 || p.x < -h + 75) ? -66 : -34;
  return p.y > top - r && p.y < 18 + r;
}
function turretSpots() {
  const L = ship.L, n = G.up.cannons;
  return n === 1 ? [0] : n === 2 ? [-L * 0.17, L * 0.17] : [-L * 0.24, 0, L * 0.24];
}

let nextId = 1;
function spawnEnemy(kind, opts) {
  const e = { id: nextId++, kind, dead: false, hitT: 0, targetable: true };
  KINDS[kind].spawn(e, opts || {});
  G.enemies.push(e);
  return e;
}

/** Slope of the water at x, for tilting things that ride it. */
function surfSlope(x) { return Math.atan2(surf(x + 10) - surf(x - 10), 20); }

// ----- The boss: THE GREAT INFLATABLE -----
// Phase 1 lobs presents. Phase 2 turns on the mall music and sends elves.
// Phase 3 springs a leak and flies around the sky spitting candy canes.

const BOSS_HP = 560;
function spawnBoss() {
  G.boss = { x: W - bossGap(), y: waterY + 260, hp: BOSS_HP, rise: 0, t: 0, atk: 2, minion: 3, flying: false, hitT: 0, dying: 0, s: 1, said: {} };
  Radio.now('Lake Superior', 'there is a SANTA standing in me');
}

function bossCenter(b) { return { x: b.x, y: b.y - 150 * b.s, r: 92 * b.s }; }

function updateBoss(dt) {
  const b = G.boss;
  b.t += dt; b.hitT = Math.max(0, b.hitT - dt);
  if (b.dying) { // deflated: zooms off like a let-go balloon
    b.dying += dt;
    b.x += Math.cos(b.dying * 9) * 300 * dt + 120 * dt;
    b.y -= 260 * dt;
    b.s = Math.max(0.2, b.s - dt * 0.3);
    if (Math.random() < dt * 30) G.parts.push({ kind: 'glitter', x: b.x, y: b.y - 80 * b.s, vx: rand(-60, 60), vy: rand(-60, 60), life: 1, t: 0, r: 3, c: pick(CONFETTI) });
    if (b.dying > 2.4) { G.boss = null; finishDay(); }
    return;
  }
  if (b.rise < 1) { // rising out of the lake
    b.rise = Math.min(1, b.rise + dt / 2.5);
    b.y = lerp(waterY + 260, surf(b.x) + 10, easeOut(b.rise));
    if (b.rise >= 1) bossBanner();
    return;
  }
  const p = b.hp / BOSS_HP;
  if (!b.flying) b.y = surf(b.x) + 10;

  if (p > 0.66) {
    b.atk -= dt;
    if (b.atk <= 0) { lobPresents(b, 3); b.atk = 2.0; }
  } else if (p > 0.33) {
    if (!b.said.p2) { b.said.p2 = true; Music.mall = true; Radio.now('Mall Santa', 'ho ho HOLD ON, music time'); }
    b.atk -= dt; b.minion -= dt;
    if (b.atk <= 0) { spawnEnemy('jingle').x = b.x - 60; b.atk = 0.6; }
    if (b.minion <= 0) { const e = spawnEnemy('elfski'); e.x = b.x - 60; b.minion = 2.6; if (Math.random() < 0.5) lobPresents(b, 2); }
  } else {
    if (!b.said.p3) {
      b.said.p3 = true; b.flying = true; Music.mall = false;
      Radio.now('Deckhand', "it sprang a leak! it's... flying?");
      SFX.deflate();
    }
    // Leaking: flits around the sky and shrinks as it loses air.
    b.s = lerp(b.s, 0.55 + 0.45 * (p / 0.33), dt * 2);
    b.x = lerp(b.x, W * 0.7 + Math.sin(b.t * 0.9) * W * 0.17, dt * 2);
    b.y = lerp(b.y, waterY - 40 + Math.sin(b.t * 1.7) * 50, dt * 2);
    b.atk -= dt;
    if (b.atk <= 0) {
      const c = bossCenter(b), e = spawnEnemy('candy');
      e.x = c.x - 40; e.y = c.y; e.vx = -rand(170, 230);
      if (Math.random() < 0.2) lobPresents(b, 2);
      b.atk = 0.45;
    }
    if (Math.random() < dt * 14) G.parts.push({ kind: 'smoke', x: b.x + 30 * b.s, y: b.y - 200 * b.s, vx: 80, vy: -40, life: 0.8, t: 0, r: 5 });
  }
}

/** Throw presents on a high arc that lands around the boat. */
function lobPresents(b, n) {
  const sx = b.x - 50, sy = b.y - 250 * b.s, T = 1.35, g = 300;
  for (let k = 0; k < n; k++) {
    const tx = ship.x + (k - (n - 1) / 2) * 60 + rand(-15, 15), ty = waterY - 30;
    spawnEnemy('present', { x: sx, y: sy, vx: (tx - sx) / T, vy: (ty - sy - 0.5 * g * T * T) / T, hp: 2 });
  }
}

function damageBoss(dmg) {
  const b = G.boss;
  if (!b || b.rise < 1 || b.dying) return;
  b.hp -= dmg; b.hitT = 0.1;
  if (b.hp <= 0) {
    b.hp = 0; b.dying = 0.001; Music.mall = false;
    SFX.deflate(); setTimeout(SFX.deflate, 250);
    const c = bossCenter(b);
    confetti(c.x, c.y, 120);
    addScore(2000, c.x, c.y);
    G.shake = 14;
    Radio.now('Everyone', 'NOT. YET.');
  }
}

// ----- Pickups -----
const PICKUPS = {
  pasty: { label: 'PASTY! +25 HULL', apply() { G.hull = Math.min(G.maxHull, G.hull + 25); } },
  thermos: { label: 'COFFEE! RAPID FIRE', apply() { G.thermosT = 8; } },
  ope: { label: 'OPE SHIELD', apply() { G.ope = true; } },
};

function maybeDrop(e) {
  if (e.kind === 'present' || e.kind === 'mint') return;
  if (Math.random() > 0.07 + G.up.drop) return;
  const kind = weighted({ pasty: G.hull < G.maxHull * 0.6 ? 0.6 : 0.4, thermos: 0.35, ope: G.ope ? 0 : 0.25 });
  G.pickups.push({ kind, x: e.x, y: e.y, vy: -60, floating: false, t: 0 });
}

function updatePickups(dt) {
  for (const p of G.pickups) {
    p.t += dt;
    if (!p.floating) {
      p.vy += 280 * dt; p.y += p.vy * dt;
      if (p.y >= surf(p.x) - 6) { p.floating = true; splash(p.x, p.y, 4); }
    } else {
      p.x -= (40 + G.wind) * dt; p.y = surf(p.x) - 6;
    }
    if (hitsShip(p.x, p.y, 14)) {
      p.done = true; PICKUPS[p.kind].apply(); SFX.pickup();
      if (p.kind === 'pasty') Radio.react('pasty', 30);
      floater(p.x, p.y - 30, PICKUPS[p.kind].label, '#6fd3a6');
    }
    if (p.x < SHORE_X - 20) p.done = true;
  }
  G.pickups = G.pickups.filter(p => !p.done);
}

// ----- Particles and floating text -----
const CONFETTI = ['#e63946', '#2a9d8f', '#ffd166', '#ffffff', '#8ac926', '#f4a261'];

function confetti(x, y, n) {
  for (let i = 0; i < n; i++) {
    G.parts.push({ kind: 'confetti', x, y, vx: rand(-220, 220), vy: rand(-260, 40), life: rand(0.8, 1.6), t: 0,
      r: rand(2.5, 4.5), rot: rand(0, 6), spin: rand(-12, 12), c: pick(CONFETTI) });
  }
}
function splash(x, y, n) {
  for (let i = 0; i < n; i++) G.parts.push({ kind: 'spray', x, y, vx: rand(-70, 70), vy: -rand(60, 170), life: 0.7, t: 0, r: rand(1.5, 3.5) });
}
function floater(x, y, text, color, life = 1.3) { G.floaters.push({ x, y, text, color, t: 0, life }); }

function updateParticles(dt) {
  for (const p of G.parts) {
    p.t += dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'confetti') { p.vy += 380 * dt; p.vx *= Math.pow(0.4, dt); p.rot += p.spin * dt; }
    else if (p.kind === 'spray') p.vy += 420 * dt;
    else if (p.kind === 'smoke') { p.r += dt * 6; }
    else if (p.kind === 'glitter') { p.vx *= Math.pow(0.2, dt); p.vy *= Math.pow(0.2, dt); }
  }
  G.parts = G.parts.filter(p => p.t < p.life);
  if (G.parts.length > 900) G.parts.splice(0, G.parts.length - 900);
  for (const f of G.floaters) { f.t += dt; f.y -= 30 * dt; }
  G.floaters = G.floaters.filter(f => f.t < f.life);

  const gust = G.gustRamp || 0;
  for (const c of CLOUDS) c.x -= (c.s + G.wind * 0.5 - gust * 160) * dt;

  // Snow once the weather turns.
  const snowRate = Math.max(0, G.gale - 0.25) * 60;
  if (Math.random() < snowRate * dt) G.flakes.push({ x: rand(0, W + 200), y: -10, vy: rand(30, 60), r: rand(1, 2.5), ph: rand(0, 6) });
  for (const f of G.flakes) { f.y += f.vy * dt; f.x += (-30 - G.wind + gust * 260) * dt + Math.sin(G.t + f.ph) * 10 * dt; }
  G.flakes = G.flakes.filter(f => f.y < H + 10 && f.x > -20 && f.x < W + 220);
}

// ----- Scoring -----
function addScore(base, x, y) {
  const mult = 1 + Math.min(3, Math.floor(G.combo / 5) * 0.5);
  const pts = Math.round(base * mult);
  G.score += pts;
  floater(x, y, '+' + pts + (mult > 1 ? ' ×' + mult : ''), mult > 1 ? '#ffd166' : '#fff');
}

/** An enemy has been beaten (by a pellet, the horn, or midnight). */
function popEnemy(e, quiet) {
  if (e.dead) return;
  e.dead = true;
  G.combo++; G.comboT = 1.3;
  if (G.combo === 15) Radio.react('combo');
  G.stats.pops++;
  addScore(e.pts, e.x, e.y - 10);
  G.horn = Math.min(1, G.horn + 0.035 * G.up.hornMul);
  confetti(e.x, e.y, e.kind === 'santa' ? 26 : 12);
  if (!quiet) {
    if (e.kind === 'jingle') playJingleNote();
    else if (e.kind === 'santa') SFX.deflate();
    else SFX.pop();
  }
  if (KINDS[e.kind].onPop) KINDS[e.kind].onPop(e);
  maybeDrop(e);
}

function hurtShip(dmg) {
  if (G.iframes > 0 || dmg <= 0) return;
  if (G.ope) {
    G.ope = false; G.iframes = 0.6; SFX.ope();
    floater(ship.x, ship.y - 80, 'ope!', '#9ad1ff');
    Radio.react('ope', 15);
    return;
  }
  G.hull -= dmg * G.up.armor;
  G.iframes = 0.5; ship.flash = 1; G.shake = Math.max(G.shake, 6);
  SFX.hit();
  if (G.hull < G.maxHull * 0.3) Radio.react('hull', 30);
}

// ----- Cannons -----
// The cannons aim and fire on their own, so their reach is what makes
// steering matter: park the boat near trouble or it gets past you.
const CANNON = { rate: 2.4, speed: 640, range: 370, spread: 0.07 };
/** Choose what turret i shoots: whatever is closest to reaching shore, roughly. */
function chooseTarget(i, from) {
  const cands = [];
  for (const e of G.enemies) {
    if (e.dead || !e.targetable || e.x > W + 10 || e.y < -20) continue;
    const d = Math.hypot(e.x - from.x, e.y - from.y);
    if (d > CANNON.range) continue;
    let p = e.x * 0.6 + d * 0.4;
    if (e.kind === 'present') p -= 260; // falling on our heads: urgent
    if (e.kind === 'jingle' && Math.hypot(e.x - ship.x, e.y - ship.y) < 220) p -= 150;
    cands.push([p, e]);
  }
  const b = G.boss;
  if (b && b.rise >= 1 && !b.dying) {
    const c = bossCenter(b);
    if (Math.hypot(c.x - from.x, c.y - from.y) < CANNON.range + c.r + 60) cands.push([c.x + 260, { x: c.x, y: c.y, vx: 0, vy: 0, boss: true }]);
  }
  if (!cands.length) return null;
  cands.sort((a, b2) => a[0] - b2[0]);
  return cands[Math.min(i, cands.length - 1)][1];
}

function updateCannons(dt) {
  const attached = G.enemies.filter(e => e.kind === 'deckelf' && e.attached && !e.dead).length;
  const shy = Math.max(0.3, Math.pow(0.6, attached)); // being watched is distracting
  const rate = CANNON.rate * G.up.rate * (G.thermosT > 0 ? 1.8 : 1) * shy;
  turretSpots().forEach((lx, i) => {
    const from = shipPoint(lx, -40);
    ship.fireT[i] -= dt;
    const tgt = chooseTarget(i, from);
    if (!tgt) return;
    // Lead the target a little.
    const d = Math.hypot(tgt.x - from.x, tgt.y - from.y), t = d / CANNON.speed;
    const ax = tgt.x + (tgt.vx || 0) * t - from.x, ay = tgt.y + (tgt.vy || 0) * t - from.y;
    const ang = Math.atan2(ay, ax);
    ship.aims[i] = ang;
    if (ship.fireT[i] > 0) return;
    ship.fireT[i] = 1 / rate;
    const a = ang + rand(-CANNON.spread, CANNON.spread);
    G.pellets.push({ x: from.x, y: from.y, vx: Math.cos(a) * CANNON.speed, vy: Math.sin(a) * CANNON.speed, dmg: G.up.dmg,
      life: (CANNON.range + 60) / CANNON.speed });
    SFX.fire();
  });
}

function updatePellets(dt) {
  const b = G.boss, bc = b && b.rise >= 1 && !b.dying ? bossCenter(b) : null;
  for (const p of G.pellets) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.x < -20 || p.x > W + 40 || p.y < -40 || p.y > H) { p.life = 0; continue; }
    for (const e of G.enemies) {
      if (e.dead || !e.targetable) continue;
      const dx = e.x - p.x, dy = e.y - p.y;
      if (dx * dx + dy * dy < (e.r + 4) * (e.r + 4)) {
        p.life = 0; e.hp -= p.dmg; e.hitT = 0.1;
        if (e.kind === 'santa') e.wob = 1;
        if (e.hp <= 0) popEnemy(e);
        else Audio.tone(rand(300, 380), 0.04, { type: 'square', vol: 0.05 });
        break;
      }
    }
    if (p.life > 0 && bc && Math.hypot(bc.x - p.x, bc.y - p.y) < bc.r) {
      p.life = 0; damageBoss(p.dmg);
      if (Math.random() < 0.5) G.parts.push({ kind: 'spray', x: p.x, y: p.y, vx: rand(-60, 60), vy: rand(-60, 0), life: 0.3, t: 0, r: 2 });
    }
  }
  G.pellets = G.pellets.filter(p => p.life > 0);
}

// ----- The horn -----
function blowHorn() {
  if (G.state !== 'play' || G.horn < 1) return;
  G.horn = 0; G.calm = 1; G.stats.horns++;
  SFX.horn();
  G.rings.push({ x: ship.x, y: ship.y - 30, r: 0, max: G.up.hornR, hitBoss: false });
  G.shake = 8;
  floater(ship.x, ship.y - 100, 'HOOONK', '#ffd166');
  Radio.react('horn');
}

function updateRings(dt) {
  for (const ring of G.rings) {
    ring.r += 950 * dt;
    for (const e of G.enemies) {
      if (!e.dead && Math.hypot(e.x - ring.x, e.y - ring.y) < ring.r) popEnemy(e, true);
    }
    const b = G.boss;
    if (b && !ring.hitBoss && b.rise >= 1 && !b.dying) {
      const c = bossCenter(b);
      if (Math.hypot(c.x - ring.x, c.y - ring.y) < ring.r + c.r) { ring.hitBoss = true; damageBoss(30); }
    }
  }
  G.rings = G.rings.filter(r => r.r <= r.max);
}

/* =====================  5. GAME FLOW  ===================== */

function newRun() {
  Object.assign(G, {
    day: 1, score: 0, hull: 100, maxHull: 100, up: freshUpgrades(), picked: {}, ope: false, thermosT: 0,
    dad: 2 + ((Math.random() * 3) | 0), horn: 0.3, lastDay: null,
    stats: { pops: 0, horns: 0, creepTotal: 0, start: performance.now() },
  });
  Radio.reset();
}

/**
 * Reset the field for a day. Hull carries over with some overnight repairs,
 * except on a retry after losing, which starts fully patched.
 */
function setupDay(retry) {
  const d = DAYS[G.day];
  Object.assign(G, {
    dayT: 0, creep: 0, spawnAcc: 0, enemies: [], pellets: [], pickups: [], rings: [], swells: [],
    gale: d.gale, wind: d.gale >= 1 ? 45 : 0, boss: null, midnight: false, midnightT: 0,
    combo: 0, comboT: 0, iframes: 1, dayStartScore: G.score, radioT: 5,
    gust: 0, gustRamp: 0, gustAt: G.day >= 2 && G.day <= 7 ? d.len * rand(0.35, 0.7) : 0,
  });
  stopCoach();
  Radio.queue = []; Radio.gap = 0;
  if (G.day === 1 && (store.get('coached', '0') !== '1' || params.has('coach'))) {
    G.coach = { seen: new Set(), current: null, t: 0, moved: 0, gap: 0 };
  }
  G.hull = retry ? G.maxHull : Math.min(G.maxHull, G.hull + G.maxHull * 0.35);
  G.horn = Math.max(G.horn, 0.3);
  Music.mall = false;
  ship.vx = 0;
  if (d.boss) spawnBoss();
  ship.x = clamp(ship.x, ...shipBounds());
}

function startDay(retry) {
  setupDay(retry);
  setState('play');
  Music.eighth = DAYS[G.day].boss ? 0.16 : 0.19;
  if (!Music.on) Music.start();
  SFX.horn();
}

function updatePlay(dt) {
  const d = DAYS[G.day];
  G.iframes = Math.max(0, G.iframes - dt);
  G.thermosT = Math.max(0, G.thermosT - dt);
  G.comboT -= dt; if (G.comboT <= 0) G.combo = 0;
  G.horn = Math.min(1, G.horn + dt * 0.012 * G.up.hornMul);

  updateShip(dt);
  updateCoach(dt);
  updateEarlyGale(dt);

  // Spawning, until midnight.
  if (!G.midnight) {
    G.dayT += dt;
    G.spawnAcc += dt * d.rate * (1 + G.dayT / 90);
    while (G.spawnAcc >= 1) { G.spawnAcc -= 1; spawnEnemy(weighted(d.mix)); }
    if (!d.boss && G.dayT >= d.len) { G.midnight = true; G.midnightT = 0; SFX.chime(); floater(W / 2, waterY - 220, 'MIDNIGHT', '#ffd166'); }
  } else if (!d.boss) {
    // Midnight: November holds. Whatever's left pops on its own.
    G.midnightT += dt;
    if (G.midnightT > 2) { G.enemies.forEach(e => popEnemy(e, true)); finishDay(); return; }
  }
  if (G.boss) updateBoss(dt);
  if (G.state !== 'play') return;

  // Enemies: move, hit the boat, or reach shore.
  for (const e of G.enemies) {
    if (e.dead) continue;
    KINDS[e.kind].update(e, dt);
    if (e.dead) continue; // e.g. a present that fell in the lake
    if (G.gustRamp > 0 && !e.attached) e.x += 260 * G.gustRamp * dt; // blown back out to sea
    e.hitT = Math.max(0, e.hitT - dt);
    if (e.dmg > 0 && hitsShip(e.x, e.y, e.r * 0.7)) {
      hurtShip(e.dmg); e.dead = true; confetti(e.x, e.y, 8);
    } else if (e.x < SHORE_X - 10 && e.creep > 0) {
      e.dead = true; G.creep += e.creep; G.stats.creepTotal += e.creep;
      SFX.creep(); floater(SHORE_X + 10, e.y, '🎄 +' + e.creep, '#ff8fa3');
      if (G.creep > 55) Radio.react('creep');
    } else if (e.x < -60 || e.y > H + 40) e.dead = true;
  }
  G.enemies = G.enemies.filter(e => !e.dead);

  updateCannons(dt);
  updatePellets(dt);
  updateRings(dt);
  updatePickups(dt);

  G.radioT -= dt;
  Radio.tick(dt);
  if (G.radioT <= 0 && !Radio.queue.length) G.radioT = rand(7, 11) + Radio.ambient() * 3;

  if (G.hull <= 0) failDay('hull');
  else if (G.creep >= 100) failDay('creep');
}

function finishDay() {
  if (G.state !== 'play') return;
  const d = DAYS[G.day];
  const hullBonus = Math.round((G.hull / G.maxHull) * 300);
  const creepBonus = Math.round((100 - G.creep) * 4);
  G.score += hullBonus + creepBonus;
  G.lastDay = { day: G.day, hullBonus, creepBonus, earned: G.score - G.dayStartScore };
  if (G.day === 1) store.set('coached', '1');
  stopCoach();
  bumpDad();
  if (d.boss) { Music.stop(); showMemorial(); return; }
  G.day++;
  showDayCard();
}

function failDay(reason) {
  setState('fail');
  G.score = G.dayStartScore;
  showFail(reason);
}

/** Dad's song count goes up every day. (It skips 29 and 30 on purpose.) */
function bumpDad() {
  G.dad += 2 + ((Math.random() * 3) | 0);
  if (G.dad === 29 || G.dad === 30) G.dad = 31;
}

// ----- Day-one coaching -----
// First-time players get a few hints on November 1, one at a time, each
// shown when it becomes relevant. Finishing day one turns them off for good.
const COACH = [
  { text: 'Drag (or ← →) to steer. Your cannons fire on their own, but only reach the dashed ring.',
    when: () => G.dayT > 0.6, done: c => c.moved > 160 || c.t > 9, ring: true },
  { text: "Incoming! That candy cane is diving at you, too fast to shoot. Steer out of the way!",
    when: () => G.enemies.some(e => e.diving), done: c => c.t > 4 },
  { text: 'Christmas is headed for the town ← Steer under it and pop it before it reaches shore!',
    when: () => G.dayT > 7 || G.creep > 0, done: c => c.t > 6 },
  { text: 'Something tasty is floating out there. Steer over it to grab it.',
    when: () => G.pickups.some(p => p.floating), done: c => c.t > 6 },
  { text: 'The horn is ready! Tap HORN (or Space) to blast everything nearby.',
    when: () => G.horn >= 1, done: c => G.stats.horns > 0 || c.t > 9 },
];

function updateCoach(dt) {
  const c = G.coach;
  if (!c) return;
  c.moved += Math.abs(ship.vx) * dt;
  if (c.current) {
    c.t += dt;
    if (c.current.done(c)) { c.current = null; G.coachRing = false; $('coach').classList.remove('show'); c.gap = 1.2; }
    return;
  }
  c.gap -= dt;
  if (c.gap > 0) return;
  const next = COACH.find(h => !c.seen.has(h) && h.when());
  if (!next) return;
  c.seen.add(next); c.current = next; c.t = 0;
  G.coachRing = !!next.ring;
  $('coach').textContent = next.text;
  $('coach').classList.add('show');
}

function stopCoach() {
  G.coach = null; G.coachRing = false;
  $('coach').classList.remove('show');
}

// ----- The gales of November came early -----
// Once a day (Nov 2 to 7), a sudden November gale blows in and shoves all
// the Christmas stuff back out over the lake. November takes care of its own.
function updateEarlyGale(dt) {
  if (G.gust > 0) {
    G.gust -= dt;
    G.gustRamp = Math.max(0, Math.min(1, G.gust, 5 - G.gust));
    if (Math.random() < dt * 80) G.flakes.push({ x: rand(-40, W), y: rand(-10, waterY), vy: rand(20, 50), r: rand(1, 2.5), ph: rand(0, 6) });
    if (G.gust <= 0) G.gustRamp = 0;
    return;
  }
  if (G.gustAt && !G.midnight && G.dayT >= G.gustAt) {
    G.gustAt = 0; G.gust = 5;
    floater(W / 2, waterY - 240, 'THE GALES OF NOVEMBER CAME EARLY', '#ffffff', 3.5);
    for (let i = 0; i < 2; i++) G.swells.push({ x: -100 - i * 260, w: 110, a: 26, v: -170 }); // rolling out to sea
    Audio.noise(3, { freq: 500, sweep: 1400, q: 0.6, vol: 0.25 });
    Radio.now(...Radio.pick(RADIO.earlyGale)[0]);
  }
}

// ----- UI: cards, HUD, radio -----
const overlay = $('overlay'), card = $('card');

function setState(s) {
  G.state = s;
  const playing = s === 'play';
  overlay.hidden = playing;
  $('hud').hidden = !playing && s !== 'paused';
  $('controls').hidden = !playing;
  if (!playing) { $('radio').classList.remove('show'); $('coach').classList.remove('show'); }
  else if (G.coach && G.coach.current) $('coach').classList.add('show');
}

function showCard(html, onClick) {
  card.className = 'card';
  card.innerHTML = html;
  card.onclick = ev => {
    const btn = ev.target.closest('[data-act]');
    if (!btn) return;
    Audio.init();
    onClick(btn.dataset.act, btn);
  };
  const first = card.querySelector('[data-act]');
  if (first && !('ontouchstart' in window)) first.focus({ preventScroll: true });
}

function chatHtml(lines) {
  return '<div class="chat">' + lines.map(([who, text]) => `<div><b>${who}</b>${text}</div>`).join('') + '</div>';
}
function dadLine() { return pick(DAD_LINES).replace('{n}', G.dad); }

function showTitle() {

    ${portrait ? '<p class="rotate">📱 Turn your phone sideways. It is a very long boat.</p>' : ''}
    ${best ? `<p class="muted">Best score ${best.toLocaleString()} · Novembers defended: ${won}</p>` : ''}

  });
}

function showHow(back) {

    <h2>HOW TO PLAY</h2>

function showStory() {
  showCard(`
    <p class="date">OCTOBER 31 · 11:59 PM</p>
    <h2>THE MOST SACRED SEASON</h2>
    <p>Between Halloween and the tenth of November, there's a season. The internet calls it Fitz Season.

  `, () => {

      G.day = jump;
      for (let i = 1; i < jump; i++) { const u = upgradeChoices()[0]; G.picked[u.id] = (G.picked[u.id] || 0) + 1; u.apply(); }

function showDayCard() {
  setState('card');
  const d = DAYS[G.day], [tName, tDesc] = THREATS[d.intro];
  const choices = G.day > 1 ? upgradeChoices() : [];
  const last = G.lastDay;
  const preview = previewImg(d.intro);
  showCard(`
    <p class="date">NOVEMBER ${G.day}</p>
    <h2>${d.title.toUpperCase()}</h2>
    <p>${d.blurb}</p>

    ${chatHtml(LAKE_CHATS[G.day])}
    <p class="fact">${FACTS[G.day]}</p>
    <p class="muted">📻 Dad: "${dadLine()}"</p>
    ${last ? `<p class="muted">November ${last.day} held: +${last.earned.toLocaleString()} points (hull bonus ${last.hullBonus}, low-creep bonus ${last.creepBonus}).</p>` : ''}
    ${choices.length ? `<h3>PICK AN UPGRADE TO CAST OFF</h3><div class="upgrades">${choices.map(u =>
      `<button class="upgrade" data-act="up:${u.id}"><b>${u.name}</b><span>${u.desc}</span></button>`).join('')}</div>`
      : '<button class="btn" data-act="go">Cast off</button>'}
  `, act => {
    if (act.startsWith('up:')) {
      const u = UPGRADES.find(x => x.id === act.slice(3));
      G.picked[u.id] = (G.picked[u.id] || 0) + 1;
      u.apply();
    }
    startDay();
  });
}

function upgradeChoices() {
  const open = UPGRADES.filter(u => (G.picked[u.id] || 0) < u.max);
  const out = [];
  while (out.length < 3 && open.length) out.push(open.splice((Math.random() * open.length) | 0, 1)[0]);
  return out;
}

function showFail(reason) {
  const n = G.day;
  const html = reason === 'creep'
    ? `<h2>🎄 IT'S CHRISTMAS NOW</h2>
       <p>Too much got through. Every store in Duluth is playing the music. Someone put up a tree.
          Things that come early in November are supposed to be gales, not this.</p>
       <p><b>It is November ${n}.</b></p>
       <p class="muted">📻 Dad: "I'm not mad. I'm just disappointed. And playing the song."</p>
       <button class="btn" data-act="retry">Take back November ${n}</button>`
    : `<h2>⚓ HEADING BACK TO PORT</h2>
       <p>The S.S. November is too banged up to stay out. The crew heads in for pasties and a nap.</p>
       <p>Honestly? Good call, Captain. Nobody needs to be out on Superior in that.</p>
       <button class="btn" data-act="retry">Try November ${n} again</button>`;
  showCard(html + '<br><button class="link" data-act="quit">Quit to title</button>', act => {

  });
}

function pause() {

    <h2>PAUSED</h2>

// Plays radio conversations one line at a time, without repeats.
const Radio = {
  queue: [], gap: 0, seen: new Set(), cool: {},
  reset() { this.queue = []; this.gap = 0; this.seen.clear(); this.cool = {}; },
  /** A conversation from `pool` that hasn't played this run, if any are left. */
  pick(pool) {
    let fresh = pool.filter(c => !this.seen.has(c));
    if (!fresh.length) { pool.forEach(c => this.seen.delete(c)); fresh = pool; }
    const c = pick(fresh);
    this.seen.add(c);
    return c;
  },
  play(convo) { this.queue = convo.slice(); this.gap = 0; },
  /** Something important happened: say it now, over whatever was playing. */
  now(who, text) { this.queue = []; this.gap = 3.5; say(who, text); G.radioT = Math.max(G.radioT, 6); },
  /** React to an event, unless mid-conversation or reacted recently. */
  react(key, cooldown = 25) {
    // Don't talk over a line that's still up, or repeat a reaction too soon.
    if (this.queue.length || this.gap > 0 || (this.cool[key] || 0) > G.t) return;
    this.cool[key] = G.t + cooldown;
    this.play(this.pick(RADIO[key]));
  },
  tick(dt) {
    this.gap -= dt;
    if (!this.queue.length || this.gap > 0) return;
    const [who, text] = this.queue.shift();
    say(who, text);
    this.gap = 2.6 + text.length * 0.025; // give longer lines time to be read
  },
  /** Every so often, play something that fits the moment. */
  ambient() {
    const d = DAYS[G.day];
    let pool = RADIO.general.slice();
    for (const kind of ['santa', 'jingle', 'reindeer', 'elfski', 'deckelf', 'latte']) {
      if (d.mix[kind]) pool = pool.concat(RADIO[kind], RADIO[kind]); // weight what's on screen
    }
    if (G.day === 8) pool = pool.concat(RADIO.gale, RADIO.gale);
    if (d.boss) pool = pool.concat(RADIO.boss, RADIO.boss);
    if (nightness() > 0.3) pool = pool.concat(RADIO.night, RADIO.night);
    const c = this.pick(pool);
    this.play(c);
    return c.length;
  },
};

let radioTimer = 0;
