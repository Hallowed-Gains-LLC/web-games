function drawRotate(c) {
  c.fillStyle = '#05070f'; c.fillRect(0, 0, W, H);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = font(18, 600); c.fillStyle = COL.textHi;
  c.fillText('Turn your phone upright', W / 2, H / 2 - 12);
  c.font = font(14, 500); c.fillStyle = rgba(COL.text, .7);
  c.fillText('the garden grows tall, not wide', W / 2, H / 2 + 16);

/* ============================================================
   The loop: 60fps while things move, 20fps when it's just twinkling,
   so it's kind to the battery.
   ============================================================ */
/**
 * Hush: after HUSH_AFTER_MS untouched (and nothing moving, no sheet open),
 * everything but the garden fades out over a few seconds, so the phone lights
 * the room less. The first touch only wakes it (see pointerdown), so a small
 * hand on the screen can't plant a seed.
 */
const HUSH_AFTER_MS = 20000;
let hushA = 1;
function updateHush(dt, ms) {
  const quiet = S.set.hush && ms - lastInput > HUSH_AFTER_MS && !drag && !anims.length && !wrap.classList.contains('open');
  hushA = quiet ? Math.max(0, hushA - dt / 3) : Math.min(1, hushA + dt / .25);
}
/** Breathing: 10 s a breath (in for 4, out for 6), 0 to 1. */
function breath(sec) { const p = (sec % 10) / 10; return p < .4 ? easeInOut(p / .4) : 1 - easeInOut((p - .4) / .6); }
/** The breathing glow around the seed pouch, once you've rested a few seconds (Settings, off by default). */
function drawBreath(c, ms) {
  if (!S.set.breathe || L.rotate) return;
  const rest = clamp((ms - lastInput - 6000) / 2500, 0, 1); if (!rest) return;
  const b = breath(ms / 1000), P = L.pouch;
  drawGlow(c, P.x, P.y - 4, P.r * (1.5 + .7 * b), COL.gold, (.08 + .3 * b) * rest);
}

function update(dt, ms) {
  updateHush(dt, ms);
  anims = anims.filter(a => ms < a.t0 + a.dur);
  for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy = p.vy * .94 - 14 * dt; }
  parts = parts.filter(p => p.life < p.max);
  floats = floats.filter(f => ms - f.t0 < f.dur);
  dispGlow += (S.glow - dispGlow) * Math.min(1, dt * 7);
  if (Math.abs(S.glow - dispGlow) < .5) dispGlow = S.glow;
}
function frame() {
  requestAnimationFrame(frame);
  const ms = now();
  const active = drag || anims.length || parts.length || floats.length || toasts.length
    || ms - lastInput < 1500 || dispGlow !== S.glow || (hushA > 0 && hushA < 1) || ms - arrivedAt < 700;
  if (!active && ms - lastDraw < 1000 / 20) return;
  const dt = Math.min(.05, (ms - lastDraw) / 1000); lastDraw = ms;
  update(dt, ms);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (L.rotate) { drawRotate(ctx); return; }
  ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
  drawScene(ctx, ms);
  if (hushA >= 1) drawUI(ctx, ms);
  else if (hushA > 0) {
    uiCtx.setTransform(1, 0, 0, 1, 0, 0); uiCtx.clearRect(0, 0, uiC.width, uiC.height);
    uiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawUI(uiCtx, ms);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = hushA; ctx.drawImage(uiC, 0, 0); ctx.globalAlpha = 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  drawBreath(ctx, ms);
  if (ms - arrivedAt < 700) { ctx.fillStyle = `rgba(5,7,15,${1 - (ms - arrivedAt) / 700})`; ctx.fillRect(0, 0, W, H); }
  drawToast(ctx, ms);   // over the hush, so a morning or a moon is still told
}
/** Everything over the garden: the part that hush fades. */
function drawUI(c, ms) {
  drawHeader(c);
  drawStatus(c);
  drawWishes(c, ms);
  drawBoard(c, ms);
  drawBar(c, ms);
  drawFlights(c, ms);
  drawParticles(c);
  drawDrag(c, ms);
}

/* ============================================================
   Touch. One finger only: a tiny hand grabbing the screen shouldn't
   do anything strange.
   ============================================================ */
function hitTest(x, y, dropping) {
  const inC = (o, k = 1) => Math.hypot(x - o.x, y - o.y) <= o.r * k;
  for (let i = 0; i < 3; i++) {
    const r = L.wish[i], m = dropping ? 8 : 0;
    if (x >= r.x - m && x <= r.x + r.w + m && y >= r.y - m && y <= r.y + r.h + m) return { kind: 'wish', i };
  }
  const i = cellAt(x, y);
  if (i >= 0) return { kind: 'cell', i };
  if (inC(L.pouch, 1.25)) return { kind: 'pouch' };
  if (inC(L.basket, dropping ? 1.9 : 1.5)) return { kind: 'basket' };
  if (!dropping && inC(L.undo, 1.5)) return { kind: 'undo' };
  if (!dropping && inC(L.book, 1)) return { kind: 'book' };
  if (!dropping && inC(L.map, 1)) return { kind: 'map' };
  if (!dropping && inC(L.gear, 1)) return { kind: 'gear' };
  return { kind: 'none' };
}

cv.addEventListener('pointerdown', e => {
  if (ptr || L.rotate) return;
  lastInput = now();
  // While hushed, a touch only brings the garden back.
  const wake = hushA < .6;
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, hit: wake ? { kind: 'none' } : hitTest(e.clientX, e.clientY), moved: false, wake };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  lastInput = now();
  ptr.x = e.clientX; ptr.y = e.clientY;
  if (!ptr.moved && !ptr.wake && Math.hypot(ptr.x - ptr.x0, ptr.y - ptr.y0) > 9) {
    ptr.moved = true;
    const h = ptr.hit;
    if (h.kind === 'cell' && S.board[h.i] && !busy(h.i)) { drag = { src: h.i, tier: S.board[h.i] }; sel = -1; }
  }
});
cv.addEventListener('pointerup', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  lastInput = now();
  ptr.x = e.clientX; ptr.y = e.clientY;
  if (drag) drop();
  else if (!ptr.moved && !ptr.wake) tap(ptr.hit);
  ptr = null;
});
cv.addEventListener('pointercancel', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (drag) { fly(drag.tier, { x: ptr.x, y: ptr.y - L.lift }, cellCenter(drag.src), 180, { hide: drag.src }); drag = null; }
  ptr = null;
});

function drop() {
  const from = { x: ptr.x, y: ptr.y - L.lift };
  const { src, tier } = drag; drag = null;
  if (S.board[src] !== tier) return;   // undone mid-drag
  const h = hitTest(from.x, from.y, true);
  if (h.kind === 'cell' && h.i !== src && !busy(h.i)) {
    if (S.board[h.i] === tier && tier < MAX_TIER) doMerge(src, h.i, from);
    else doMove(src, h.i, from);
    return;
  }
  if (h.kind === 'wish' && S.wishes[h.i].tier === tier && now() >= (S.wishes[h.i].born || 0)) { deliver(h.i, src, from); return; }
  if (h.kind === 'basket') { gather(src, from); return; }
  if (h.kind === 'wish') hintWish(h.i);
  fly(tier, from, cellCenter(src), 180, { hide: src });
}

function tap(h) {
  switch (h.kind) {
    case 'pouch': sel = -1; plantSeed(); break;
    case 'cell': tapCell(h.i); break;
    case 'wish': tapWish(h.i); break;
    case 'basket':
      if (sel >= 0) { gather(sel, null); sel = -1; }
      else toast({ title: 'The basket', sub: 'Drag anything here to tuck it away for ✦.' });
      break;
    case 'undo': sel = -1; doUndo(); break;
    case 'book': openBook(); break;
    case 'map': openMap(); break;
    case 'gear': openSettings(); break;
    default: sel = -1;
  }
}
function tapCell(i) {
  if (busy(i)) return;
  const t = S.board[i];
  if (sel < 0) { if (t) { sel = i; sfx.tick(); } return; }
  if (i === sel) { sel = -1; return; }
  const st = S.board[sel];
  if (!st) { sel = t ? i : -1; return; }
  if (!t) { doMove(sel, i, null); sel = -1; return; }
  if (t === st && t < MAX_TIER) { doMerge(sel, i, null); sel = -1; return; }
  sel = i; sfx.tick();
}
function tapWish(wi) {
  const w = S.wishes[wi];
  if (now() < (w.born || 0)) return;
  let cell = -1;
  if (sel >= 0 && S.board[sel] === w.tier) cell = sel;
  else for (let k = N - 1; k >= 0; k--) if (S.board[k] === w.tier && !busy(k)) { cell = k; break; }
  if (cell >= 0) { deliver(wi, cell, null); sel = -1; }
  else hintWish(wi);
}

/* ============================================================
   The sheet: intro, settings, garden book
   ============================================================ */
const wrap = document.getElementById('wrap'), sheetEl = document.getElementById('sheet');
let sheetClose = null, resetArmed = false, installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });

// A finger tap on the canvas opens a sheet from `pointerup`, and then the
// browser fires its own `click` at the same spot a moment later. By then the
// sheet's backdrop (or one of its buttons) is under the finger, so that
// leftover click would close the sheet straight away. Swallow it.
let sheetOpenedAt = -1e9;
document.addEventListener('click', e => {
  if (now() - sheetOpenedAt < 450) { e.stopPropagation(); e.preventDefault(); }
}, true);

function openSheet(html, onClose) {
  if (!wrap.classList.contains('open')) sheetOpenedAt = now();
  sheetEl.innerHTML = html; sheetEl.scrollTop = 0;
  wrap.classList.add('open'); sheetClose = onClose || null; resetArmed = false;
  for (const el of sheetEl.querySelectorAll('canvas[data-t]')) paintItem(el, +el.dataset.t, el.dataset.k !== '0');
  if (ptr) { ptr = null; drag = null; }
}
function closeSheet() {
  wrap.classList.remove('open');
  const f = sheetClose; sheetClose = null; if (f) f();
  lastInput = now();
}
document.getElementById('back').addEventListener('click', closeSheet);
sheetEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-close')) { closeSheet(); return; }
  if (b.dataset.area) {
    const a = areaById(b.dataset.area);
    if (a.id === S.area) { closeSheet(); return; }
    if (S.opened.includes(a.id)) { closeSheet(); goToArea(a.id); return; }
    document.getElementById('mapnote').innerHTML = `<b>${a.name}</b>: ${a.opens.need}`;
    return;
  }
  if (b.dataset.dim !== undefined) { S.set.dim = +b.dataset.dim; applySettings(); save(); openSettings(); return; }
  if (b.dataset.tog) {
    const k = b.dataset.tog; S.set[k] = !S.set[k]; applySettings(); save();
    if (k === 'sound' && S.set.sound) later(60, () => sfx.wish());
    if (k === 'buzz' && S.set.buzz) buzz(15);
    openSettings(); return;
  }
  if (b.id === 'inst' && installPrompt) { installPrompt.prompt(); installPrompt = null; return; }
  if (b.id === 'reset') {
    if (!resetArmed) { resetArmed = true; b.textContent = 'Tap again to clear your whole garden'; return; }
    const keep = S.set; S = freshState(); S.set = keep; S.intro = true;
    ensureWishes(); undoStack = []; anims = []; sel = -1; dispGlow = 0; sceneDirty = true;
    save(); closeSheet(); toast({ title: 'A fresh garden', sub: 'Tap the seed pouch to begin.' });
  }
});

function applySettings() {

}

function openIntro() {

      <li><canvas data-t="9"></canvas><div>Visitors drop by <b>wishing</b> for things. Tap their card once you've grown it.</div></li>

/**
 * The end of the story, once the first moon has risen: a quiet card with

 */
function openEnding() {
  if (S.ended) return;

  S.ended = true; save();
  openSheet(`

function toggleRow(k, title, note) {
  return `<div class="row"><div><b>${title}</b><small>${note}</small></div>
    <button class="tog" data-tog="${k}" aria-pressed="${!!S.set[k]}">${S.set[k] ? 'On' : 'Off'}</button></div>`;
}
function openSettings() {
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const installed = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone;
  const install = installed ? 'Moonflower is on your home screen, and it works without internet too.'
    : installPrompt ? `Put it on your home screen so it's one tap away, even with no internet.</small><button class="btn" id="inst" style="margin-top:10px">Add to home screen</button><small>`
    : ios ? 'In Safari, tap <b>Share</b>, then <b>Add to Home Screen</b>. Then it opens with one tap and works with no internet.'
    : 'In your browser menu, choose <b>Install app</b> or <b>Add to Home screen</b>. Then it works with no internet too.';
  openSheet(`
    <h2>Settings</h2>

function openBook() {
  const items = ITEMS.slice(1).map((it, k) => {
    const t = k + 1, known = t <= S.best;
    return `<div class="${known ? '' : 'unk'}"><canvas data-t="${t}" data-k="${known ? 1 : 0}"></canvas>${known ? it.name : '?'}</div>`;
  }).join('');
  const wonders = DECOR.map((d, k) => k < S.decor ? `<li>✦ ${d.name}</li>` : `<li class="no">· · ·</li>`).join('');
  const next = S.decor < DECOR.length
    ? `Next: <b>${DECOR[S.decor].name}</b>, in ${fmt(decorAt(S.decor + 1) - S.peak)} ✦.`
    : `Every wonder has come. Each ${fmt(STAR_STEP)} ✦ now adds a constellation to the sky.`;
  const nextItem = S.best < MAX_TIER ? `<p><small>Merge two ${ITEMS[S.best].many} to find out what comes next.</small></p>`
    : `<p><small>${AREA.words.done}</small></p>`;
  openSheet(`
    <h2>${AREA.words.book}</h2>
    <div class="book">${items}</div>
    ${nextItem}
    <h3>Garden wonders · ${S.decor} of ${DECOR.length}</h3>
    <ul class="wonders">${wonders}</ul>
    <p><small>${next}</small></p>
    <h3>So far</h3>
    <div class="stats">
      <span>Visits to the town</span><span>${fmt(S.visits)}</span>
      <span>From the pouch</span><span>${fmt(S.stats.seeds)}</span>
      <span>Things grown</span><span>${fmt(S.stats.merges)}</span>
      <span>Wishes granted</span><span>${fmt(S.stats.wishes)}</span>
      ${S.skyMoons ? `<span>Moons grown</span><span>${fmt(S.skyMoons)}</span>` : ''}
      <span>Glow, all told</span><span>${fmt(S.peak)} ✦</span>
    </div>
    ${S.skyMoons ? `<h3>In the stars</h3><ul class="wonders">${MOON_SHAPES.slice(0, Math.min(S.skyMoons, MOON_SHAPES.length)).map(m => `<li>✦ ${m.name}</li>`).join('')}</ul>` : ''}
    <button class="btn done" data-close>Back to the garden</button>`);
}

/** The park's live parts: the lamps, the fountain's jet and the glints on its water, the bandstand's little lights, moths at a lamp. */
function livePark(c, V, t) {
  for (const [i, x] of PARK_LAMPS.entries()) {
    const y = nearY(V, x) + 2, a = .85 + .06 * Math.sin(t * 1.3 + i * 2) + .04 * Math.sin(t * 3.7 + i);
    drawGlow(c, x, y - 37, 30, '#ffcf87', .48 * a);
    c.globalAlpha = a; c.fillStyle = '#ffd796'; c.fillRect(x - 2.4, y - 40.5, 4.8, 5.8); c.globalAlpha = 1;
  }
  { const x = PARK_LAMPS[0], y = nearY(V, x) + 2 - 38;   // two moths that can't leave the first lamp alone
    for (let k = 0; k < 2; k++) {
      const a = t * (1.1 + k * .4) + k * 2.6, mx = x + Math.cos(a) * (6 + k * 2), my = y + Math.sin(a * 1.7) * 3.4 - 1;
      c.fillStyle = 'rgba(240,226,200,.75)'; c.fillRect(mx - .6, my - .4, 1.2, .8);
    }
  }
  { const x = PARK_FOUNTAIN, y = V.G + 3;              // the jet: drops rise and fall back into the bowl and the basin
    c.fillStyle = 'rgba(205,226,245,.7)';
    for (let k = 0; k < 14; k++) {
      const p = (t * .55 + k / 14) % 1, side = k % 2 ? 1 : -1, reach = 4 + (k % 3) * 3;
      const dx = side * reach * p, dy = -16 * p + 24 * p * p;   // up a little, then down into the bowl
      c.globalAlpha = .35 + .5 * (1 - p); c.fillRect(x + dx - .45, y - 34 + dy, .9, .9);
    }
    c.globalAlpha = 1;
    c.strokeStyle = 'rgba(205,226,245,.4)'; c.lineWidth = .7;      // the bowl spilling over its edges: dashes that fall
    c.setLineDash([1.6, 2.4]); c.lineDashOffset = -t * 9;
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(x + s * 11.5, y - 25); c.quadraticCurveTo(x + s * 15, y - 22, x + s * 16, y - 4); c.stroke(); }
    c.setLineDash([]); c.lineDashOffset = 0;
    const m = moonPos(V);                                 // the moon's glints on the water
    for (let i = 0; i < 4; i++) {
      const ww = 5 + 3 * Math.sin(t * .9 + i * 1.7) - i, gx = x + 14 + 8 * Math.sin(i * 2.4) - (m.x - 364) * .05;
      c.fillStyle = `rgba(239,227,192,${.38 - i * .07})`; c.fillRect(gx - ww / 2, y - 2.5 + i * 1.6, ww, .7);
    }
    for (let k = 0; k < 3; k++) {                         // rings where the spill lands
      const p = (t * .7 + k / 3) % 1, rx = x + (k - 1) * 22;
      c.strokeStyle = `rgba(200,215,240,${.25 * (1 - p)})`; c.lineWidth = .5; c.beginPath(); c.ellipse(rx, y - 1, 1 + p * 4, (1 + p * 4) * .3, 0, 0, TAU); c.stroke();
    }
  }
  { const x = PARK_BANDSTAND, y = farY(V, x) + 1 - 10.6; // the bandstand's string of lights, far off
    for (let k = 0; k < 5; k++) {
      const lx = x - 9 + k * 4.5, ly = y + 1.6 * Math.sin((k / 4) * Math.PI), a = .55 + .35 * Math.sin(t * 1.1 + k * 1.9);
      drawGlow(c, lx, ly, 3.2, '#ffd27a', a * .6); c.globalAlpha = a; c.fillStyle = ['#ffd27a', '#f7a3a3', '#b8e0a8'][k % 3]; c.fillRect(lx - .4, ly - .4, .8, .8); c.globalAlpha = 1;
    }
  }
}

/** A rounded rectangle, added to the current path (by hand: older Safari has no roundRect). */
function laneRound(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);

}
/** Steam: soft rising curls, for anything hot. */
function laneSteam(c, x, y, h, n = 2) {
  c.strokeStyle = 'rgba(240,236,228,.5)'; c.lineWidth = 2.2; c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const sx = x + (i - (n - 1) / 2) * 8;
    c.beginPath(); c.moveTo(sx, y); c.bezierCurveTo(sx - 5, y - h * .3, sx + 5, y - h * .6, sx, y - h); c.stroke();
  }
}

// like those, feet at (0, 0), facing right, returning their eyes.
Object.assign(VISITOR_ART, {
  // A moth hovers where it sits, like the bat, its wings a slow soft flutter.
  Moth(c, t) {
    const flap = .55 + .45 * Math.abs(Math.sin(t * 7)), y = -14 + Math.sin(t * 1.3) * 1.8 + Math.sin(t * 3.1) * .6;
    c.fillStyle = '#4a4660';
    c.save(); c.translate(0, y);
    for (const s of [-1, 1]) {
      c.save(); c.scale(s * flap, 1);
      tri(c, .6, -.6, 6.4, -4.6, 7.2, -.8, 1, .6);                    // forewing
      ell(c, 3.4, 1.8, 3, 2, .5);                                     // hindwing
      c.restore();
    }
    c.fillStyle = '#5a5672'; ell(c, 0, .4, 1.1, 3.2);
    c.strokeStyle = '#5a5672'; c.lineWidth = .45; c.beginPath(); c.moveTo(-.4, -2.4); c.quadraticCurveTo(-1.6, -4.6, -2.8, -4.8); c.moveTo(.4, -2.4); c.quadraticCurveTo(1.6, -4.6, 2.8, -4.8); c.stroke();
    c.restore();
    return [[-.5, y - 2.2, .3], [.5, y - 2.2, .3]];
  },
  // A dormouse sits up, round as a bun, its fluffy tail wrapped round its feet.
  Dormouse(c) {
    c.fillStyle = '#4e3f38';
    c.strokeStyle = '#4e3f38'; c.lineWidth = 2.2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-3, -1.4); c.bezierCurveTo(-7.5, -.6, -6.5, 1, -1, -.4); c.lineTo(3.4, -.6); c.stroke();   // the tail, round its feet

    ell(c, 2, -9, 1.3, 1.3); ell(c, 4.4, -8.8, 1.1, 1.1);
    c.fillStyle = '#6a5850'; ell(c, 1.4, -2.2, 2, 1.6); ell(c, 5.8, -6, .7, .6);
    return [[4.2, -6.8, .6]];
  },
});

// The terrace: four little houses in a row, x from 136 to 296. Each one's
// left edge, roof height, door side, and which of its windows the live layer
// lights (u: upstairs left/right, d: downstairs), and whether they flicker
// (firelight) or hold steady (a lamp).
const LANE_ROW = [
  { x: 136, h: 46, door: 1, lit: [['d', 'flicker']] },
  { x: 176, h: 50, door: 0, lit: [['u1', 'steady']] },
  { x: 216, h: 46, door: 1, lit: [['d', 'steady'], ['u0', 'feed']] },   // someone else up for a night feed
  { x: 256, h: 42, door: 0, lit: [['u1', 'flicker']] },
];
const LANE_W = 40;      // one house's width
/** A window in the terrace: its rectangle, from the house and which window it is. */
function laneWindow(V, hse, which) {
  const y = nearY(V, hse.x + LANE_W / 2) + 1;
  if (which === 'd') return { x: hse.x + (hse.door ? 6 : 22), y: y - 17, w: 11, h: 9 };
  return { x: hse.x + (which === 'u0' ? 6 : 23), y: y - 36, w: 10, h: 9 };
}
/** The lane's chimneys: where smoke comes from, in scene units (live). */
function laneChimneys(V) {
  return [
    { x: 64, y: nearY(V, 64) + 1 - 44 },                         // the cottage
    { x: 176, y: nearY(V, 176) + 1 - LANE_ROW[1].h - 10 },        // the terrace's party walls

// Visitors sit on the quay: by the bollard, beside the lobster pots, and

const HARBOUR_SPOTS = [{ x: 60, dir: 1 }, { x: 158, dir: 1 }, { x: 358, dir: -1 }];

// The scene's layout, in scene units. The quay is the near ground (nearY),
// cut in two by a slip where the sea comes right in: rain rings there, and
// a little footbridge crosses its mouth (so winter snow has a plank to sit
// on rather than hanging over the water).
const harbourSeaY = V => V.G - 34;              // the horizon
const HARBOUR_SLIP = [206, 316];                // the slip's mouth, between the quays
const HARBOUR_LIGHT = 332;                      // the lighthouse, on the far right headland
/** The quay on either side of the slip (a path; the ends lean out a little toward you). */
function harbourQuay(c, V, left) {
  const [a, b] = HARBOUR_SLIP;
  c.beginPath();
  if (left) {
    c.moveTo(V.xl, V.vh + 2);
    for (let x = V.xl; x < a; x += 4) c.lineTo(x, nearY(V, x));
    c.lineTo(a, nearY(V, a)); c.lineTo(a - 4, V.vh + 2);
  } else {
    c.moveTo(b + 10, V.vh + 2); c.lineTo(b, nearY(V, b));
    for (let x = b + 4; x <= V.xr + 4; x += 4) c.lineTo(x, nearY(V, x));
    c.lineTo(V.xr + 4, V.vh + 2);
  }
  c.closePath();
}
/** A headland on the horizon, through [x, height above the sea] points. */
function harbourHill(c, V, pts, col) {
  const H = harbourSeaY(V);
  c.fillStyle = col; c.beginPath(); c.moveTo(pts[0][0], H + 1); c.lineTo(pts[0][0], H - pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    const [x0, h0] = pts[i - 1], [x1, h1] = pts[i];
    c.quadraticCurveTo(x0, H - h0, (x0 + x1) / 2, H - (h0 + h1) / 2);
    if (i === pts.length - 1) c.lineTo(x1, H - h1);
  }
  c.lineTo(pts[pts.length - 1][0], H + 1); c.closePath(); c.fill();
}
function harbourBollard(c, x, y) {
  c.fillStyle = '#161b2c'; c.fillRect(x - 2.2, y - 6, 4.4, 6.4); ell(c, x, y - 6, 3.4, 1.4);
  c.fillStyle = '#283049'; ell(c, x, y - 6.5, 2.6, .8);
}
function harbourPot(c, x, y, w) {
  c.fillStyle = '#171a24'; c.beginPath(); c.moveTo(x - w, y); c.arc(x, y, w, Math.PI, 0); c.closePath(); c.fill();
  c.strokeStyle = '#2a3042'; c.lineWidth = .5; c.beginPath();
  for (let k = -w + 2; k < w; k += 2.6) { const h = Math.sqrt(w * w - k * k); c.moveTo(x + k, y); c.lineTo(x + k, y - h); }
  c.stroke();
  c.strokeStyle = '#2e2a28'; c.lineWidth = .9; c.beginPath(); c.arc(x, y, w, Math.PI, 0); c.stroke();
  c.fillStyle = '#231d1a'; c.fillRect(x - w - .6, y - .6, w * 2 + 1.2, 1.6);
}

/** The harbour's live parts: the moon on the sea, the lighthouse beam, the two boats, the quay lamp, ripples in the slip. */
function liveHarbour(c, V, t) {
  const G = V.G, H = harbourSeaY(V), m = moonPos(V), [sa, sb] = HARBOUR_SLIP;

  // The moon's path on the sea: narrow at the horizon, wider and more broken nearer.
  const y1 = nearY(V, m.x) - 1.5;
  for (let y = H + 1, i = 0; y < y1; y += 2, i++) {
    const u = (y - H) / (y1 - H);
    const w = (1.6 + u * 10) * (.5 + .5 * Math.sin(t * 1.1 + i * 1.7)), dx = Math.sin(t * .55 + i * 2.3) * (.6 + u * 2.6);
    c.fillStyle = `rgba(239,227,192,${(.46 - u * .2) * (.55 + .45 * Math.sin(t * 1.6 + i * 2.9))})`;
    c.fillRect(m.x + dx - w / 2, y, w, .6 + u * .5);
  }
  // Now and then a glint of moonlight further out.
  for (let i = 0; i < 10; i++) {
    const x = V.xl + ((i * 97.3 + 40) % (V.xr - V.xl)), y = H + 3 + ((i * 13.7) % 22);
    if (y > nearY(V, x) - 3) continue;
    const a = Math.pow(Math.max(0, Math.sin(t * (.4 + i * .05) + i * 2.1)), 3) * .35;
    if (a < .02) continue;
    c.fillStyle = `rgba(214,222,245,${a})`; c.fillRect(x - 1.4, y, 2.8, .5);
  }

  // The lighthouse. Its beam turns slowly (about 19 s a turn): seen side-on it
  // reaches out long and faint, turning toward you it shortens to nothing and
  // the lamp warms a little. No flash. The moon is left out of it.
  { const x = HARBOUR_LIGHT, y = H - 17.4 - 21.6, th = t * .33, side = Math.cos(th), f = Math.pow(Math.max(0, Math.sin(th)), 2);
    const len = 150 * Math.abs(side), s = Math.sign(side) || 1;
    if (len > 2) {
      c.save(); c.beginPath(); c.rect(V.xl - 10, -10, V.xr - V.xl + 20, V.vh + 20); c.arc(m.x, m.y, 16, 0, TAU); c.clip('evenodd');
      const g = c.createLinearGradient(x, y, x + s * len, y);
      g.addColorStop(0, `rgba(255,236,186,${.11 * Math.abs(side)})`); g.addColorStop(1, 'rgba(255,236,186,0)');
      c.fillStyle = g; c.beginPath(); c.moveTo(x, y - 1); c.lineTo(x + s * len, y - 1 - len * .08); c.lineTo(x + s * len, y + 1 + len * .05); c.lineTo(x, y + 1); c.closePath(); c.fill();

  // Two boats in for the night, bobbing: a fishing boat moored to the
  // bollard, and a rowing boat further out. Only what's above the water is drawn.
  { const x = 140, w = G - 14 + Math.sin(t * .8) * .7, tilt = Math.sin(t * .6 + 1) * .035;
    c.fillStyle = 'rgba(5,8,20,.5)'; ell(c, x, w + 1.4, 15, 1.6);
    for (let k = 0; k < 4; k++) {                          // the mast lantern's reflection
      const yy = w + 2 + k * 2.4; if (yy > nearY(V, x) - 2) break;
      c.fillStyle = `rgba(255,214,150,${.22 - k * .045})`; c.fillRect(x + 3 + Math.sin(t * 1.3 + k * 2) * 1.2 - 1.2, yy, 2.4, .6);
    }
    c.save(); c.translate(x, w); c.rotate(tilt);
    c.strokeStyle = '#1d2342'; c.lineWidth = .8; c.beginPath(); c.moveTo(3, -6); c.lineTo(3, -24); c.stroke();
    c.strokeStyle = 'rgba(70,80,120,.6)'; c.lineWidth = .3; c.beginPath(); c.moveTo(3, -23); c.lineTo(15.5, -8.6); c.moveTo(3, -23); c.lineTo(-13.5, -6); c.stroke();
    c.fillStyle = '#1b2140'; c.fillRect(-10, -12.5, 7, 7.2); c.fillStyle = '#272f50'; c.fillRect(-10.8, -13.3, 8.6, 1.2);
    drawGlow(c, -7.5, -10, 5, '#ffcf87', .45); c.fillStyle = '#ffcf87'; c.fillRect(-8.6, -11, 2.2, 1.8);
    c.fillStyle = '#121831'; c.beginPath(); c.moveTo(-14, -6); c.quadraticCurveTo(0, -4.6, 16, -9);
    c.quadraticCurveTo(14, -2, 10, 0); c.lineTo(-12, 0); c.quadraticCurveTo(-14, -2, -14, -6); c.fill();
    c.strokeStyle = '#2e3860'; c.lineWidth = .8; c.beginPath(); c.moveTo(-14, -6); c.quadraticCurveTo(0, -4.6, 16, -9); c.stroke();
    const a = .8 + .12 * Math.sin(t * 2.1);
    drawGlow(c, 3, -25, 8, '#ffd796', .5 * a); c.fillStyle = '#ffe0a6'; c.fillRect(2.2, -26, 1.6, 2);
    c.restore();
    const bx = 184, by = nearY(V, 184) - 3;                   // the mooring line, from the bow to the bollard
    c.strokeStyle = 'rgba(48,46,52,.9)'; c.lineWidth = .5; c.beginPath(); c.moveTo(x + 15.5, w - 8.4); c.quadraticCurveTo((x + 15.5 + bx) / 2, Math.max(w - 8.4, by) + 4, bx, by); c.stroke();
  }
  { const x = 262, w = G - 21 + Math.sin(t * .7 + 2) * .5, tilt = Math.sin(t * .5 + 3) * .05;
    c.fillStyle = 'rgba(5,8,20,.45)'; ell(c, x, w + 1, 8, 1.1);
    c.save(); c.translate(x, w); c.rotate(tilt);
    c.strokeStyle = '#262c48'; c.lineWidth = .6; c.beginPath(); c.moveTo(-6, -3.6); c.lineTo(9, -5.4); c.stroke();
    c.fillStyle = '#151b36'; c.beginPath(); c.moveTo(-8, -3); c.quadraticCurveTo(0, -2, 8.4, -4.2); c.quadraticCurveTo(7, -.4, 5, 0); c.lineTo(-6, 0); c.quadraticCurveTo(-7.6, -.6, -8, -3); c.fill();
    c.strokeStyle = '#3b4672'; c.lineWidth = .5; c.beginPath(); c.moveTo(-8, -3); c.quadraticCurveTo(0, -2, 8.4, -4.2); c.stroke();

  }
  c.restore();
  { const x = 197, y = nearY(V, 197) + 3 - 33;
    drawGlow(c, x, y, 24, '#ffcf87', .42 * la); c.globalAlpha = la; c.fillStyle = '#ffd796'; c.fillRect(x - 2.2, y - 2.6, 4.4, 5); c.globalAlpha = 1;
    c.fillStyle = '#11141e'; c.beginPath(); c.moveTo(x - 3.8, y - 2.6); c.lineTo(x, y - 6.2); c.lineTo(x + 3.8, y - 2.6); c.closePath(); c.fill(); }
}

const areaById = id => AREAS.find(a => a.id === id) || AREAS[0];
let AREA = AREAS[0];

/**
 * The town at night: every area as a lit spot on a winding lane, the one
 * you're in marked, closed ones dim with what opens them. Tap an open spot
 * to walk there. The lane runs on into the dark past the last area, for the
 * parts of the town that are still asleep.
 */
function openMap() {
  const spots = AREAS.map(a => {
    const open = S.opened.includes(a.id), here = a.id === S.area;
    return `<button class="spot${here ? ' here' : ''}${open ? '' : ' shut'}" data-area="${a.id}" style="left:${a.map.x}%;top:${a.map.y}%">
      <canvas data-icon="${a.id}"></canvas><b>${a.name}</b><small>${here ? 'You are here' : open ? 'Walk over' : 'Not yet'}</small></button>`;
  }).join('');
  const pts = AREAS.map(a => a.map), last = pts[pts.length - 1];
  const lane = pts.map((p, i) => i ? ` Q ${(pts[i - 1].x + p.x) / 2 + 14} ${(pts[i - 1].y + p.y) / 2 + 10} ${p.x} ${p.y}` : `M ${p.x} ${p.y}`).join('');
  const shut = AREAS.find(a => !S.opened.includes(a.id));
  openSheet(`
    <h2>The town at night</h2>
    <div class="map">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 70 Q 20 60 40 66 T 80 58 T 100 62 L 100 100 L 0 100 Z" fill="#0c1127"/>
        <path d="M0 84 Q 30 76 55 82 T 100 78 L 100 100 L 0 100 Z" fill="#0a0f22"/>
        <path d="${lane}" fill="none" stroke="#e9cf98" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="1 2.6" vector-effect="non-scaling-stroke"/>
        <path d="M ${last.x} ${last.y} Q ${last.x + 18} ${last.y - 6} 100 ${last.y - 26}" fill="none" stroke="#e9cf98" stroke-opacity=".12" stroke-width="1.6" stroke-dasharray="1 2.6" vector-effect="non-scaling-stroke"/>
      </svg>
      ${spots}
    </div>
    <p class="mapnote" id="mapnote">${shut ? `<b>${shut.name}</b>: ${shut.opens.need}` : 'Every lane is open. Wander wherever you like.'}</p>
    <button class="btn done" data-close>Back to ${AREA.name.toLowerCase()}</button>`);
  for (const el of sheetEl.querySelectorAll('canvas[data-icon]')) {
    const a = areaById(el.dataset.icon);
    paintItem(el, a.map.icon, S.opened.includes(a.id), a.art);
  }
}

/* ============================================================
   Start
   ============================================================ */
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => later(150, layout));
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { lastInput = now(); onReturn(); } });
window.addEventListener('pagehide', save);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

useArea(areaById(S.area));
ensureWishes();
retireUnreachableWishes();   // a save from before the pouch grew, or from 1.0
applySettings();
layout();
if (document.fonts && document.fonts.load) document.fonts.load(font(16, 700)).then(() => { lastInput = now(); }).catch(() => {});
onReturn();
checkOpenings();   // a garden already past a Moonflower opens the farm (after onReturn: it saves, which resets S.last)
if (!S.intro) openIntro();
else {
  // A save from before 1.2 can hold moons on the board: send them up now,
  // one after another. One that rose but whose ending was never seen (the
  // app closed mid-flight) gets its ending.
  S.board.forEach((t, i) => { if (t === MAX_TIER) later(1200 + 900 * S.board.slice(0, i).filter(x => x === MAX_TIER).length, () => riseMoon(i)); });
  if (S.skyMoons && !S.ended) later(1500, openEnding);
}
requestAnimationFrame(frame);
</script>
