const moonShape = k => MOON_SHAPES[k % MOON_SHAPES.length];
let risingMoons = 0;            // on their way up: counted, not drawn in the sky yet
let newest = null;              // { k, t0 }: the constellation whose stars are still appearing

function riseMoon(cell) {
  // It may have been moved (or undone) during the pause: find it.
  if (S.board[cell] !== MAX_TIER) cell = S.board.findIndex((t, i) => t === MAX_TIER && !busy(i));
  if (cell < 0) return;
  if (drag && drag.src === cell) drag = null;
  if (sel === cell) sel = -1;
  // A risen moon can't be undone (undo would hand back the two Wishing trees
  // and keep the moon), so the undo history ends here, as it does on a visit.
  undoStack = [];
  const V = sceneView(), k = S.skyMoons, slot = skySlots[k];
  // With the sky full, it rises toward the big moon instead.
  const at = slot || moonPos(V), to = { x: V.ox + at.x * V.s, y: at.y * V.s };
  S.board[cell] = 0; S.skyMoons++; risingMoons++;
  fly(MAX_TIER, cellCenter(cell), to, MOON_RISE_MS, { s1: .12, arc: L.cell * .6 });
  sfx.rise(); buzz(10);
  later(MOON_RISE_MS, () => {
    risingMoons--;
    newest = { k, t0: now() };
    burst(to.x, to.y, 10, .6);
    // What the basket would have paid. Given on landing, not before, so the
    // wonders it brings don't cover the sky while the moon is on its way.
    gain(value(MAX_TIER), to);
    if (!S.ended) later(1600, openEnding);   // after its stars have come out
    else if (slot) toast({ title: moonShape(k).name, sub: 'A new constellation, from the moon you grew', tier: MAX_TIER, dur: 3600 });
    else toast({ title: 'Another moon for the sky', sub: `${fmt(S.skyMoons)} moons, and the sky is full of them.`, tier: MAX_TIER, dur: 3600 });
  });
  save();
}

/**
 * The sky's constellations, in scene units: one per grown moon (named shapes,
 * brighter, from the front of skySlots) and, once every wonder has come, one
 * per STAR_STEP glow (faint loose shapes, from the back). A new moon's stars
 * come out one by one, then its lines.
 */
function drawConstellations(c, t, ms) {
  const n = skySlots.length;
  const moons = Math.min(S.skyMoons - risingMoons, n);
  const glows = S.decor >= DECOR.length ? Math.min(n - moons, 1 + Math.floor((S.peak - decorAt(DECOR.length)) / STAR_STEP)) : 0;
  for (let i = 0; i < glows; i++) {
    const { x, y, glow } = skySlots[n - 1 - i];
    c.strokeStyle = 'rgba(220,210,255,.16)'; c.lineWidth = .5; c.beginPath();
    glow.forEach(([dx, dy], k) => k ? c.lineTo(x + dx, y + dy) : c.moveTo(x + dx, y + dy)); c.stroke();
    for (const [dx, dy] of glow) { drawGlow(c, x + dx, y + dy, 4, '#f3ecd0', .5 + .2 * Math.sin(t + x + dx)); c.fillStyle = '#f7f0d8'; c.fillRect(x + dx - .6, y + dy - .6, 1.2, 1.2); }
  }
  for (let k = 0; k < moons; k++) {
    const { x, y } = skySlots[k], shape = moonShape(k);
    const since = newest && newest.k === k ? ms - newest.t0 : 1e9;
    const shown = i => clamp((since - i * STAR_STEP_MS) / 400, 0, 1);
    const linesIn = clamp((since - shape.pts.length * STAR_STEP_MS) / 900, 0, 1);
    const P = shape.pts.map(([a, b]) => [x + a * SHAPE_R, y + b * SHAPE_R]);
    if (linesIn > 0) {
      c.strokeStyle = `rgba(232,222,255,${.3 * linesIn})`; c.lineWidth = .6; c.beginPath();
      for (const [a, b] of shape.lines) { c.moveTo(P[a][0], P[a][1]); c.lineTo(P[b][0], P[b][1]); }
      c.stroke();
    }
    P.forEach(([px, py], i) => {
      const a = shown(i); if (!a) return;
      drawGlow(c, px, py, 5, '#f6ecc8', a * (.6 + .2 * Math.sin(t * 1.3 + i * 1.7 + k)));
      c.globalAlpha = a; c.fillStyle = '#fff7de'; c.fillRect(px - .8, py - .8, 1.6, 1.6); c.globalAlpha = 1;
    });
  }
  if (newest && ms - newest.t0 > 6000) newest = null;
}

/* ============================================================
   Coming back after a while
   ============================================================ */
const GIFT_LINES = [
  n => `A moth left you ${n}.`,
  n => `The owl saved you ${n}.`,
  n => `${n[0].toUpperCase() + n.slice(1)} turned up by the gate.`,
  n => `The fox dug up ${n}.`,
];
function onReturn() {
  const away = Date.now() - (S.last || Date.now());
  if (S.intro && away > AWAY_MS) {
    S.visits++;
    // A gift is a step or two better than the pouch.
    const tier = Math.max(S.best >= 8 ? 3 : S.best >= 5 ? 2 : 1, pouchTier() + 1);
    const n = Math.min(3, emptyCount());
    undoStack = [];
    for (let k = 0; k < n; k++) later(500 + k * 220, () => {
      const i = pickSpawnCell(); if (i < 0) return;
      S.board[i] = tier;
      fly(tier, { x: L.pouch.x, y: L.pouch.y - 12 }, cellCenter(i), 320, { s0: .35, arc: 30, hide: i });
      sfx.seed(); save();
    });
    const what = n === 1 ? `one ${ITEMS[tier].name.toLowerCase()}` : `${['', '', 'two', 'three'][n]} ${ITEMS[tier].many.toLowerCase()}`;
    toast({ title: 'Welcome back', sub: n ? GIFT_LINES[Math.floor(Math.random() * GIFT_LINES.length)](what) : 'Your garden waited for you.', dur: 3600 });
  }
  checkMorning();   // before save(), which would count this visit as the night's
  save();
}

/* ============================================================
   Drawing the board, the bar and the bits on top
   ============================================================ */
function drawItem(c, tier, x, y, size, ms, seed = 0, scale = 1) {
  if (!tier || scale <= 0) return;
  const sp = sprite(tier), t = ms / 1000;
  c.save(); c.translate(x, y);
  if (tier === 9) c.scale(scale * (.86 + .14 * Math.cos(t * 2.1 + seed)), scale);
  else if (tier === 12) { c.translate(0, Math.sin(t * .9 + seed) * size * .02); c.scale(scale, scale); }
  else if (tier === 10) c.scale(scale, scale);
  else {
    const base = size * .33;
    c.translate(0, base); c.rotate(Math.sin(t * 1.1 + seed * 1.7) * .03); c.translate(0, -base); c.scale(scale, scale);
  }
  c.drawImage(sp, -size / 2, -size / 2, size, size);
  if (tier === 10) drawGlow(c, 0, size * .08, size * .3, COL.fly, .14 + .12 * Math.sin(t * 2.3 + seed));
  c.restore();
}

function drawHeader(c) {
  const y = L.st + L.headerH / 2;
  c.textBaseline = 'middle'; c.textAlign = 'left';
  c.font = font(18, 700); c.fillStyle = rgba(COL.textHi, .9);
  c.fillText(`✦ ${fmt(dispGlow)}`, L.cx + 2, y);
  c.strokeStyle = rgba(COL.text, .7); c.lineWidth = 1.8; c.lineCap = 'round'; c.lineJoin = 'round';
  // garden book
  c.save(); c.translate(L.book.x, L.book.y); c.beginPath();
  c.moveTo(0, -6); c.quadraticCurveTo(-6, -9, -11, -7); c.lineTo(-11, 7); c.quadraticCurveTo(-6, 5, 0, 8);
  c.quadraticCurveTo(6, 5, 11, 7); c.lineTo(11, -7); c.quadraticCurveTo(6, -9, 0, -6); c.lineTo(0, 8); c.stroke();
  c.restore();
  // settings
  c.save(); c.translate(L.gear.x, L.gear.y);
  c.beginPath(); c.arc(0, 0, 3.2, 0, TAU); c.stroke();
  c.beginPath(); c.arc(0, 0, 7.4, 0, TAU); c.stroke();
  c.lineWidth = 2.6;
  for (let i = 0; i < 8; i++) { const a = i * TAU / 8; c.beginPath(); c.moveTo(Math.cos(a) * 7.6, Math.sin(a) * 7.6); c.lineTo(Math.cos(a) * 10, Math.sin(a) * 10); c.stroke(); }
  c.restore();
}

function drawStatus(c) {
  const y = L.scene.h - 17, x0 = L.cx, w = L.cw;
  let label, right = '', frac = null;
  const tier = drag ? drag.tier : sel >= 0 ? S.board[sel] : 0;
  if (tier) {
    label = ITEMS[tier].name;
    right = tier >= MAX_TIER ? 'the last bloom of all' : tier + 1 <= S.best ? `two make a ${ITEMS[tier + 1].name}` : 'two make something new';
  } else if (S.stats.seeds === 0 && S.stats.merges === 0) label = 'Tap the seed pouch below';
  else if (S.stats.merges === 0) label = 'Drag a seed onto another seed';
  else if (S.decor < DECOR.length) {
    const a = decorAt(S.decor), b = decorAt(S.decor + 1);
    label = `Next: ${DECOR[S.decor].name}`; right = `${fmt(Math.max(0, b - S.peak))} ✦ to go`;
    frac = clamp((S.peak - a) / (b - a), 0, 1);
  } else {
    const base = decorAt(DECOR.length), k = Math.floor((S.peak - base) / STAR_STEP), a = base + k * STAR_STEP;
    label = 'Next: a new constellation'; right = `${fmt(a + STAR_STEP - S.peak)} ✦ to go`;
    frac = clamp((S.peak - a) / STAR_STEP, 0, 1);
  }
  c.textBaseline = 'alphabetic';
  c.textAlign = 'right'; c.font = font(12, 600); c.fillStyle = rgba(COL.text, .55);
  const rw = right ? c.measureText(right).width : 0;
  c.fillText(right, x0 + w, y);
  c.textAlign = 'left'; fitFont(c, label, w - rw - 12, 12.5, 600);
  c.fillStyle = rgba(COL.textHi, tier ? .9 : .72);
  c.fillText(label, x0, y);
  if (frac !== null) {
    rr(c, x0, y + 6, w, 3, 1.5); c.fillStyle = 'rgba(255,255,255,.07)'; c.fill();
    if (frac > 0) { rr(c, x0, y + 6, Math.max(3, w * frac), 3, 1.5); c.fillStyle = rgba(COL.gold, .55); c.fill(); }
  }
}

function drawWishes(c, ms) {
  for (let i = 0; i < 3; i++) {
    const r = L.wish[i], w = S.wishes[i];
    rr(c, r.x, r.y, r.w, r.h, 14); c.fillStyle = 'rgba(15,20,42,.95)'; c.fill();
    let show = null, a = 1;
    if (w.prev && ms < w.prev.until) { show = w.prev; a = clamp((w.prev.until - ms) / 180, 0, 1); }
    else if (ms >= (w.born || 0)) { show = w; a = clamp((ms - (w.born || 0)) / 380, 0, 1); }
    if (w.prev && ms >= w.prev.thanks && ms < w.prev.thanks + 1100) {
      const p = (ms - w.prev.thanks) / 1100;
      c.globalAlpha = Math.sin(p * Math.PI) * .9; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = font(12.5, 600); c.fillStyle = COL.textHi;
      c.fillText('thank you ♥', r.x + r.w / 2, r.y + r.h / 2 - p * 14);
      c.globalAlpha = 1;
    }
    if (!show) continue;
    const ready = show === w && boardHas(w.tier);
    c.save(); c.globalAlpha = a;
    rr(c, r.x + .5, r.y + .5, r.w - 1, r.h - 1, 14);
    if (ready) { c.strokeStyle = rgba(COL.gold, .4 + .25 * Math.sin(ms / 380)); c.lineWidth = 1.6; }
    else { c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = 1; }
    c.stroke();
    const sp = Math.min(r.h * .86, r.w * .46), ix = r.x + 4 + sp / 2, iy = r.y + r.h / 2;
    if (show.tier <= S.best) drawItem(c, show.tier, ix, iy, sp, ms, i * 3);
    else {   // something you haven't grown yet: its shape, and a question
      c.drawImage(silhouette(show.tier), ix - sp / 2, iy - sp / 2, sp, sp);
      c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = font(sp * .34, 700);
      c.fillStyle = rgba(COL.gold, .6 + .25 * Math.sin(ms / 600 + i)); c.fillText('?', ix, iy);
    }
    const tx = r.x + sp + 8, tw = r.w - sp - 14;
    c.textAlign = 'left'; c.textBaseline = 'middle';
    fitFont(c, show.who, tw, 12.5, 600); c.fillStyle = rgba(COL.text, .66);
    c.fillText(show.who, tx, r.y + r.h * .34);
    fitFont(c, `✦ ${fmt(show.reward)}`, tw, 15, 700); c.fillStyle = rgba(COL.textHi, .92);
    c.fillText(`✦ ${fmt(show.reward)}`, tx, r.y + r.h * .66);
    c.restore();
  }
}

function drawBoard(c, ms) {
  const { bx, by, cell } = L, gap = Math.max(3, cell * .06);
  rr(c, bx - 6, by - 6, L.bw + 12, L.bh + 12, 18); c.fillStyle = 'rgba(9,12,26,.85)'; c.fill();
  const selTier = drag ? drag.tier : sel >= 0 ? S.board[sel] : 0;
  const target = drag ? cellAt(ptr.x, ptr.y - L.lift) : -1;
  const pulse = .5 + .5 * Math.sin(ms / 300);
  for (let i = 0; i < N; i++) {
    const x = bx + (i % COLS) * cell, y = by + Math.floor(i / COLS) * cell;
    rr(c, x + gap / 2, y + gap / 2, cell - gap, cell - gap, cell * .2);
    c.fillStyle = i === target && target !== drag.src ? 'rgba(242,196,109,.13)' : '#10162d'; c.fill();
    if (i === sel) { c.strokeStyle = rgba(COL.gold, .8); c.lineWidth = 2; c.stroke(); }
    else if (selTier && selTier < MAX_TIER && S.board[i] === selTier && !(drag && drag.src === i)) {
      c.strokeStyle = rgba(COL.gold, .18 + .28 * pulse); c.lineWidth = 1.6; c.stroke();
    }
  }
  for (let i = 0; i < N; i++) {
    const t = S.board[i];
    if (!t || (drag && drag.src === i)) continue;
    if (anims.some(a => a.k === 'fly' && a.hide === i)) continue;
    let scale = 1;
    for (const a of anims) if (a.k === 'pop' && a.cell === i) {
      const p = (ms - a.t0) / a.dur;
      scale = p < 0 ? 0 : p >= 1 ? 1 : .55 + .45 * easeOutBack(p);
    }
    const p = cellCenter(i);
    drawItem(c, t, p.x, p.y, cell, ms, i, scale);
  }
}

function drawBar(c, ms) {
  const P = L.pouch, empties = emptyCount();
  // basket
  const B = L.basket, bump = clamp(1 - (ms - basketBump) / 350, 0, 1);
  if (drag) drawGlow(c, B.x, B.y, B.r * 2, COL.gold, .16 + .08 * Math.sin(ms / 250));
  c.save(); c.translate(B.x, B.y); c.scale(1 + bump * .14, 1 - bump * .08);
  c.strokeStyle = '#7a5c42'; c.lineWidth = 3.2; c.beginPath(); c.arc(0, -4, 15, Math.PI * 1.05, Math.PI * 1.95); c.stroke();
  c.fillStyle = '#86674c'; c.beginPath(); c.moveTo(-21, -4); c.lineTo(21, -4); c.lineTo(16, 17); c.lineTo(-16, 17); c.closePath(); c.fill();
  c.strokeStyle = '#664c37'; c.lineWidth = 1.4;
  for (const y of [3, 10]) { c.beginPath(); c.moveTo(-19.5 + (y + 4) * .23, y); c.lineTo(19.5 - (y + 4) * .23, y); c.stroke(); }
  for (const x of [-10, 0, 10]) { c.beginPath(); c.moveTo(x, -3); c.lineTo(x * .8, 16); c.stroke(); }
  rr(c, -23, -8, 46, 6, 3); c.fillStyle = '#9c7a5c'; c.fill();
  c.restore();
  // undo
  const U = L.undo, canUndo = undoStack.length > 0;
  c.save(); c.translate(U.x, U.y); c.globalAlpha = canUndo ? .8 : .28;
  c.strokeStyle = COL.text; c.lineWidth = 2.6; c.lineCap = 'round';
  c.beginPath(); c.arc(2, 2, 11, Math.PI, Math.PI * 2.25); c.stroke();
  c.fillStyle = COL.text; c.beginPath(); c.moveTo(-14, -1); c.lineTo(-4, -1); c.lineTo(-9, 7); c.closePath(); c.fill();
  c.restore();
  // seed pouch
  const breathe = .5 + .5 * Math.sin(ms / 900);
  drawGlow(c, P.x, P.y, P.r * 1.9, COL.gold, empties ? .08 + .07 * breathe : .02);
  const sh = clamp(1 - (ms - pouchShake) / 400, 0, 1);
  c.save(); c.translate(P.x + Math.sin(ms / 25) * 4 * sh, P.y); c.scale(P.r / 40, P.r / 40);
  if (!empties) c.globalAlpha = .55;
  c.fillStyle = '#6e5641'; c.beginPath();
  c.moveTo(-14, -18); c.bezierCurveTo(-36, -6, -38, 26, -18, 32); c.quadraticCurveTo(0, 38, 18, 32); c.bezierCurveTo(38, 26, 36, -6, 14, -18); c.closePath(); c.fill();
  c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.moveTo(8, -14); c.bezierCurveTo(32, -2, 32, 24, 14, 32); c.quadraticCurveTo(27, 10, 8, -14); c.fill();
  c.fillStyle = '#806349'; c.beginPath();
  c.moveTo(-14, -18); c.lineTo(-21, -30); c.lineTo(-9, -25); c.lineTo(-3, -35); c.lineTo(3, -25); c.lineTo(10, -34); c.lineTo(13, -24); c.lineTo(22, -29); c.lineTo(14, -18); c.closePath(); c.fill();
  c.fillStyle = COL.seed;
  for (const [x, y, a] of [[-5, -26, -.4], [4, -27, .3], [-.5, -30, 0]]) { c.beginPath(); c.ellipse(x, y, 3, 4.2, a, 0, TAU); c.fill(); }
  c.strokeStyle = '#c9a878'; c.lineWidth = 3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-15, -17); c.quadraticCurveTo(0, -12, 15, -17); c.stroke();
  c.lineWidth = 2; c.beginPath(); c.ellipse(-5, -12, 5, 3, -.5, 0, TAU); c.ellipse(5, -12, 5, 3, .5, 0, TAU); c.stroke();
  c.save(); c.beginPath(); c.rect(-30, -10, 60, 40); c.arc(5, 9, 9, 0, TAU); c.clip('evenodd');
  c.fillStyle = 'rgba(240,222,170,.75)'; c.beginPath(); c.arc(0, 11, 10, 0, TAU); c.fill(); c.restore();
  c.restore();
  // labels
  c.textAlign = 'center'; c.textBaseline = 'top'; c.font = font(12, 600);
  c.fillStyle = rgba(COL.text, .5);
  c.fillText('Basket', B.x, B.y + B.r - 1);
  c.fillText('Undo', U.x, U.y + U.r - 1);
  c.fillText('Seeds', P.x, P.y + P.r + 2);
}

function drawFlights(c, ms) {
  for (const a of anims) {
    if (a.k !== 'fly') continue;
    const p = clamp((ms - a.t0) / a.dur, 0, 1), e = easeInOut(p);
    const x = lerp(a.from.x, a.to.x, e), y = lerp(a.from.y, a.to.y, e) - Math.sin(p * Math.PI) * a.arc;
    drawItem(c, a.tier, x, y, L.cell, ms, 0, lerp(a.s0, a.s1, e));
  }
}
function drawParticles(c) {
  for (const p of parts) drawGlow(c, p.x, p.y, p.r * (1 - p.life / p.max) + 1, p.col, .9 * (1 - p.life / p.max));
  for (const f of floats) {
    const p = (now() - f.t0) / f.dur;
    c.globalAlpha = Math.min(1, (1 - p) * 2) * .9; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = font(14, 700); c.fillStyle = f.col; c.fillText(f.text, f.x, f.y - p * 26);
    c.globalAlpha = 1;
  }
}
function drawDrag(c, ms) {
  if (!drag) return;
  const x = ptr.x, y = ptr.y - L.lift;
  drawGlow(c, x, y, L.cell * .75, COL.gold, .14);
  drawItem(c, drag.tier, x, y, L.cell * 1.12, ms, 0, 1);
}
function drawToast(c, ms) {
  const t = toasts[0]; if (!t) return;
  if (!t.t0) t.t0 = ms;
  const p = ms - t.t0;
  if (p > t.dur) { toasts.shift(); return; }
  const a = Math.min(1, p / 250, (t.dur - p) / 400);
  const top = L.st + L.headerH, bottom = L.scene.h - 30;
  const cy = Math.max(top + 30, (top + bottom) / 2);
  const icon = t.tier ? 44 : 0;
  c.font = font(15, 700); const tw1 = c.measureText(t.title).width;
  c.font = font(12.5, 500); const tw2 = t.sub ? c.measureText(t.sub).width : 0;
  const maxW = L.cw - 10;
  const w = Math.min(maxW, Math.max(tw1, tw2) + icon + 34), h = t.sub ? 58 : 40;
  const x = W / 2 - w / 2, y = cy - h / 2 + (1 - a) * 8;
  c.save(); c.globalAlpha = a;
  rr(c, x, y, w, h, 18); c.fillStyle = 'rgba(10,13,30,.92)'; c.fill();
  c.strokeStyle = rgba(COL.gold, t.wonder ? .45 : .2); c.lineWidth = 1; c.stroke();
  if (t.tier) drawItem(c, t.tier, x + 12 + icon / 2, y + h / 2, icon * 1.1, ms, 0, 1);
  const tx = x + 17 + icon, avail = w - 30 - icon;
  c.textAlign = 'left'; c.textBaseline = 'middle';
  fitFont(c, t.title, avail, 15, 700); c.fillStyle = COL.textHi;
  c.fillText(t.title, tx, t.sub ? y + 21 : y + h / 2);
  if (t.sub) { fitFont(c, t.sub, avail, 12.5, 500); c.fillStyle = rgba(COL.text, .78); c.fillText(t.sub, tx, y + 40); }
  c.restore();
}

function drawRotate(c) {
  c.fillStyle = '#05070f'; c.fillRect(0, 0, W, H);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = font(18, 600); c.fillStyle = COL.textHi;
  c.fillText('Turn your phone upright', W / 2, H / 2 - 12);
  c.font = font(14, 500); c.fillStyle = rgba(COL.text, .7);
  c.fillText('the garden grows tall, not wide', W / 2, H / 2 + 16);
}

/* ============================================================
   The loop: 60fps while things move, 20fps when it's just twinkling,
   so it's kind to the battery.
   ============================================================ */
/**
 * Hush: after HUSH_AFTER_MS untouched (and nothing moving, no sheet open),
 * everything but the garden fades out over a few seconds, so the phone lights
 * the room less. The first touch only wakes it (see pointerdown), so a small
 * hand on the screen can't plant a seed.
 */
const HUSH_AFTER_MS = 20000;
let hushA = 1;
function updateHush(dt, ms) {
  const quiet = S.set.hush && ms - lastInput > HUSH_AFTER_MS && !drag && !anims.length && !wrap.classList.contains('open');
  hushA = quiet ? Math.max(0, hushA - dt / 3) : Math.min(1, hushA + dt / .25);
}
/** Breathing: 10 s a breath (in for 4, out for 6), 0 to 1. */
function breath(sec) { const p = (sec % 10) / 10; return p < .4 ? easeInOut(p / .4) : 1 - easeInOut((p - .4) / .6); }
/** The breathing glow around the seed pouch, once you've rested a few seconds (Settings, off by default). */
function drawBreath(c, ms) {
  if (!S.set.breathe || L.rotate) return;
  const rest = clamp((ms - lastInput - 6000) / 2500, 0, 1); if (!rest) return;
  const b = breath(ms / 1000), P = L.pouch;
  drawGlow(c, P.x, P.y - 4, P.r * (1.5 + .7 * b), COL.gold, (.08 + .3 * b) * rest);
}

function update(dt, ms) {
  updateHush(dt, ms);
  anims = anims.filter(a => ms < a.t0 + a.dur);
  for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy = p.vy * .94 - 14 * dt; }
  parts = parts.filter(p => p.life < p.max);
  floats = floats.filter(f => ms - f.t0 < f.dur);
  dispGlow += (S.glow - dispGlow) * Math.min(1, dt * 7);
  if (Math.abs(S.glow - dispGlow) < .5) dispGlow = S.glow;
}
function frame() {
  requestAnimationFrame(frame);
  const ms = now();
  const active = drag || anims.length || parts.length || floats.length || toasts.length
    || ms - lastInput < 1500 || dispGlow !== S.glow || (hushA > 0 && hushA < 1);
  if (!active && ms - lastDraw < 1000 / 20) return;
  const dt = Math.min(.05, (ms - lastDraw) / 1000); lastDraw = ms;
  update(dt, ms);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (L.rotate) { drawRotate(ctx); return; }
  ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
  drawScene(ctx, ms);
  if (hushA >= 1) drawUI(ctx, ms);
  else if (hushA > 0) {
    uiCtx.setTransform(1, 0, 0, 1, 0, 0); uiCtx.clearRect(0, 0, uiC.width, uiC.height);
    uiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawUI(uiCtx, ms);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = hushA; ctx.drawImage(uiC, 0, 0); ctx.globalAlpha = 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  drawBreath(ctx, ms);
  drawToast(ctx, ms);   // over the hush, so a morning or a moon is still told
}
/** Everything over the garden: the part that hush fades. */
function drawUI(c, ms) {
  drawHeader(c);
  drawStatus(c);
  drawWishes(c, ms);
  drawBoard(c, ms);
  drawBar(c, ms);
  drawFlights(c, ms);
  drawParticles(c);
  drawDrag(c, ms);
}

/* ============================================================
   Touch. One finger only: a tiny hand grabbing the screen shouldn't
   do anything strange.
   ============================================================ */
function hitTest(x, y, dropping) {
  const inC = (o, k = 1) => Math.hypot(x - o.x, y - o.y) <= o.r * k;
  for (let i = 0; i < 3; i++) {
    const r = L.wish[i], m = dropping ? 8 : 0;
    if (x >= r.x - m && x <= r.x + r.w + m && y >= r.y - m && y <= r.y + r.h + m) return { kind: 'wish', i };
  }
  const i = cellAt(x, y);
  if (i >= 0) return { kind: 'cell', i };
  if (inC(L.pouch, 1.25)) return { kind: 'pouch' };
  if (inC(L.basket, dropping ? 1.9 : 1.5)) return { kind: 'basket' };
  if (!dropping && inC(L.undo, 1.5)) return { kind: 'undo' };
  if (!dropping && inC(L.book, 1)) return { kind: 'book' };
  if (!dropping && inC(L.gear, 1)) return { kind: 'gear' };
  return { kind: 'none' };
}

cv.addEventListener('pointerdown', e => {
  if (ptr || L.rotate) return;
  lastInput = now();
  // While hushed, a touch only brings the garden back.
  const wake = hushA < .6;
  ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, hit: wake ? { kind: 'none' } : hitTest(e.clientX, e.clientY), moved: false, wake };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  lastInput = now();
  ptr.x = e.clientX; ptr.y = e.clientY;
  if (!ptr.moved && !ptr.wake && Math.hypot(ptr.x - ptr.x0, ptr.y - ptr.y0) > 9) {
    ptr.moved = true;
    const h = ptr.hit;
    if (h.kind === 'cell' && S.board[h.i] && !busy(h.i)) { drag = { src: h.i, tier: S.board[h.i] }; sel = -1; }
  }
});
cv.addEventListener('pointerup', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  lastInput = now();
  ptr.x = e.clientX; ptr.y = e.clientY;
  if (drag) drop();
  else if (!ptr.moved && !ptr.wake) tap(ptr.hit);
  ptr = null;
});
cv.addEventListener('pointercancel', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (drag) { fly(drag.tier, { x: ptr.x, y: ptr.y - L.lift }, cellCenter(drag.src), 180, { hide: drag.src }); drag = null; }
  ptr = null;
});

function drop() {
  const from = { x: ptr.x, y: ptr.y - L.lift };
  const { src, tier } = drag; drag = null;
  if (S.board[src] !== tier) return;   // undone mid-drag
  const h = hitTest(from.x, from.y, true);
  if (h.kind === 'cell' && h.i !== src && !busy(h.i)) {
    if (S.board[h.i] === tier && tier < MAX_TIER) doMerge(src, h.i, from);
    else doMove(src, h.i, from);
    return;
  }
  if (h.kind === 'wish' && S.wishes[h.i].tier === tier && now() >= (S.wishes[h.i].born || 0)) { deliver(h.i, src, from); return; }
  if (h.kind === 'basket') { gather(src, from); return; }
  if (h.kind === 'wish') hintWish(h.i);
  fly(tier, from, cellCenter(src), 180, { hide: src });
}

function tap(h) {
  switch (h.kind) {
    case 'pouch': sel = -1; plantSeed(); break;
    case 'cell': tapCell(h.i); break;
    case 'wish': tapWish(h.i); break;
    case 'basket':
      if (sel >= 0) { gather(sel, null); sel = -1; }
      else toast({ title: 'The basket', sub: 'Drag anything here to tuck it away for ✦.' });
      break;
    case 'undo': sel = -1; doUndo(); break;
    case 'book': openBook(); break;
    case 'gear': openSettings(); break;
    default: sel = -1;
  }
}
function tapCell(i) {
  if (busy(i)) return;
  const t = S.board[i];
  if (sel < 0) { if (t) { sel = i; sfx.tick(); } return; }
  if (i === sel) { sel = -1; return; }
  const st = S.board[sel];
  if (!st) { sel = t ? i : -1; return; }
  if (!t) { doMove(sel, i, null); sel = -1; return; }
  if (t === st && t < MAX_TIER) { doMerge(sel, i, null); sel = -1; return; }
  sel = i; sfx.tick();
}
function tapWish(wi) {
  const w = S.wishes[wi];
  if (now() < (w.born || 0)) return;
  let cell = -1;
  if (sel >= 0 && S.board[sel] === w.tier) cell = sel;
  else for (let k = N - 1; k >= 0; k--) if (S.board[k] === w.tier && !busy(k)) { cell = k; break; }
  if (cell >= 0) { deliver(wi, cell, null); sel = -1; }
  else hintWish(wi);
}

/* ============================================================
   The sheet: intro, settings, garden book
   ============================================================ */
const wrap = document.getElementById('wrap'), sheetEl = document.getElementById('sheet');
let sheetClose = null, resetArmed = false, installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });

// A finger tap on the canvas opens a sheet from `pointerup`, and then the
// browser fires its own `click` at the same spot a moment later. By then the
// sheet's backdrop (or one of its buttons) is under the finger, so that
// leftover click would close the sheet straight away. Swallow it.
let sheetOpenedAt = -1e9;
document.addEventListener('click', e => {
  if (now() - sheetOpenedAt < 450) { e.stopPropagation(); e.preventDefault(); }
}, true);

function openSheet(html, onClose) {
  if (!wrap.classList.contains('open')) sheetOpenedAt = now();
  sheetEl.innerHTML = html; sheetEl.scrollTop = 0;
  wrap.classList.add('open'); sheetClose = onClose || null; resetArmed = false;
  for (const el of sheetEl.querySelectorAll('canvas[data-t]')) paintItem(el, +el.dataset.t, el.dataset.k !== '0');
  if (ptr) { ptr = null; drag = null; }
}
function closeSheet() {
  wrap.classList.remove('open');
  const f = sheetClose; sheetClose = null; if (f) f();
  lastInput = now();
}
document.getElementById('back').addEventListener('click', closeSheet);
sheetEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-close')) { closeSheet(); return; }
  if (b.dataset.dim !== undefined) { S.set.dim = +b.dataset.dim; applySettings(); save(); openSettings(); return; }
  if (b.dataset.tog) {
    const k = b.dataset.tog; S.set[k] = !S.set[k]; applySettings(); save();
    if (k === 'sound' && S.set.sound) later(60, () => sfx.wish());
    if (k === 'buzz' && S.set.buzz) buzz(15);
    openSettings(); return;
  }
  if (b.id === 'inst' && installPrompt) { installPrompt.prompt(); installPrompt = null; return; }
  if (b.id === 'reset') {
    if (!resetArmed) { resetArmed = true; b.textContent = 'Tap again to clear your whole garden'; return; }
    const keep = S.set; S = freshState(); S.set = keep; S.intro = true;
    ensureWishes(); undoStack = []; anims = []; sel = -1; dispGlow = 0; sceneDirty = true;
    save(); closeSheet(); toast({ title: 'A fresh garden', sub: 'Tap the seed pouch to begin.' });
  }
});

function applySettings() {
  document.getElementById('dim').style.opacity = DIM[S.set.dim] ?? DIM[1];
  document.getElementById('warm').style.opacity = S.set.warm ? .5 : 0;
}

function openIntro() {
  openSheet(`
    <h2 class="title">Moonflower</h2>
    <p class="lede">A quiet garden for the small hours.</p>
    <ul class="how">
      <li><canvas data-t="1"></canvas><div>Tap the <b>seed pouch</b> at the bottom for a seed.</div></li>
      <li><canvas data-t="4"></canvas><div>Drag two alike together, or tap one and then the other, and they <b>grow</b> into something new.</div></li>
      <li><canvas data-t="9"></canvas><div>Visitors drop by <b>wishing</b> for things. Tap their card once you've grown it.</div></li>
      <li><span class="glyph">☾</span><div>Nothing runs out and nothing can go wrong. Put it down any time. <b>Your garden will wait.</b></div></li>
    </ul>
    <button class="btn done" data-close>Into the garden</button>`,
    () => { S.intro = true; save(); });
}

/**
 * The end of the story, once the first moon has risen: a quiet card with
 * what it took, and an invitation to keep going. Shown once (S.ended); a
 * save with a moon in the sky but no ending yet gets it at start-up.
 */
function openEnding() {
  if (S.ended) return;
  if (wrap.classList.contains('open')) { later(1500, openEnding); return; }   // never on top of another sheet
  S.ended = true; save();
  openSheet(`
    <h2 class="title">Goodnight, moon</h2>
    <canvas class="endmoon" data-t="${MAX_TIER}"></canvas>
    <p class="lede">You grew a moon, one seed at a time, in the small hours.<br>It has gone up into the stars as the Sleeping Moon, to keep watch over the garden.</p>
    <div class="stats">
      <span>Visits to the garden</span><span>${fmt(S.visits)}</span>
      <span>From the pouch</span><span>${fmt(S.stats.seeds)}</span>
      <span>Things grown</span><span>${fmt(S.stats.merges)}</span>
      <span>Wishes granted</span><span>${fmt(S.stats.wishes)}</span>
      <span>Glow, all told</span><span>${fmt(S.peak)} ✦</span>
    </div>
    <p><small>The garden isn't finished with you. Every moon you grow from now on rises to make a new constellation${S.decor < DECOR.length ? ', and the wonders keep coming' : ''}. The seed pouch gives ${ITEMS[pouchTier()].many.toLowerCase()} now. Rest well.</small></p>
    <button class="btn done" data-close>Keep growing</button>`);
}

function toggleRow(k, title, note) {
  return `<div class="row"><div><b>${title}</b><small>${note}</small></div>
    <button class="tog" data-tog="${k}" aria-pressed="${!!S.set[k]}">${S.set[k] ? 'On' : 'Off'}</button></div>`;
}
function openSettings() {
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const installed = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone;
  const install = installed ? 'Moonflower is on your home screen, and it works without internet too.'
    : installPrompt ? `Put it on your home screen so it's one tap away, even with no internet.</small><button class="btn" id="inst" style="margin-top:10px">Add to home screen</button><small>`
    : ios ? 'In Safari, tap <b>Share</b>, then <b>Add to Home Screen</b>. Then it opens with one tap and works with no internet.'
    : 'In your browser menu, choose <b>Install app</b> or <b>Add to Home screen</b>. Then it works with no internet too.';
  openSheet(`
    <h2>Settings</h2>
    <div class="row col"><b>Brightness</b><small>On top of your phone's own brightness.</small></div>
    <div class="seg">${['Darkest', 'Dim', 'Moonlit'].map((n, i) => `<button data-dim="${i}" aria-pressed="${S.set.dim === i}">${n}</button>`).join('')}</div>
    ${toggleRow('warm', 'Warmer light', 'Filters out most of the blue.')}
    ${toggleRow('sound', 'Soft chimes', 'Very quiet. On iPhone they follow the silent switch.')}
    ${navigator.vibrate ? toggleRow('buzz', 'Gentle vibration', 'A tiny tap when things grow.') : ''}
    ${toggleRow('hush', 'Fade to the garden', 'After 20 seconds untouched, only the garden stays lit. Tap anywhere to bring it back.')}
    ${toggleRow('breathe', 'Breathing glow', 'When you rest, the seed pouch glows in and out, six breaths a minute. Breathe along if it helps.')}
    ${toggleRow('weather', 'Weather', 'Gentle rain on some nights, snow on some winter ones.')}
    <div class="row col"><b>Keep it on your phone</b><small>${install}</small></div>
    <div class="row col"><button class="btn ghost" id="reset">Start a new garden</button></div>
    <button class="btn done" data-close>Done</button>
    <p class="ver">Moonflower ${VERSION}</p>`);
}
function openBook() {
  const items = ITEMS.slice(1).map((it, k) => {
    const t = k + 1, known = t <= S.best;
    return `<div class="${known ? '' : 'unk'}"><canvas data-t="${t}" data-k="${known ? 1 : 0}"></canvas>${known ? it.name : '?'}</div>`;
  }).join('');
  const wonders = DECOR.map((d, k) => k < S.decor ? `<li>✦ ${d.name}</li>` : `<li class="no">· · ·</li>`).join('');
  const next = S.decor < DECOR.length
    ? `Next: <b>${DECOR[S.decor].name}</b>, in ${fmt(decorAt(S.decor + 1) - S.peak)} ✦.`
    : `Every wonder has come. Each ${fmt(STAR_STEP)} ✦ now adds a constellation to the sky.`;
  const nextItem = S.best < MAX_TIER ? `<p><small>Merge two ${ITEMS[S.best].many} to find out what comes next.</small></p>`
    : `<p><small>You grew a moon. There's nothing left to find, only more to grow: every moon rises into the sky as a new constellation.</small></p>`;
  openSheet(`
    <h2>Garden book</h2>
    <div class="book">${items}</div>
    ${nextItem}
    <h3>Garden wonders · ${S.decor} of ${DECOR.length}</h3>
    <ul class="wonders">${wonders}</ul>
    <p><small>${next}</small></p>
    <h3>So far</h3>
    <div class="stats">
      <span>Visits to the garden</span><span>${fmt(S.visits)}</span>
      <span>From the pouch</span><span>${fmt(S.stats.seeds)}</span>
      <span>Things grown</span><span>${fmt(S.stats.merges)}</span>
      <span>Wishes granted</span><span>${fmt(S.stats.wishes)}</span>
      ${S.skyMoons ? `<span>Moons grown</span><span>${fmt(S.skyMoons)}</span>` : ''}
      <span>Glow, all told</span><span>${fmt(S.peak)} ✦</span>
    </div>
    ${S.skyMoons ? `<h3>In the stars</h3><ul class="wonders">${MOON_SHAPES.slice(0, Math.min(S.skyMoons, MOON_SHAPES.length)).map(m => `<li>✦ ${m.name}</li>`).join('')}</ul>` : ''}
    <button class="btn done" data-close>Back to the garden</button>`);
}

/* ============================================================
   Start
   ============================================================ */
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => later(150, layout));
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { lastInput = now(); onReturn(); } });
window.addEventListener('pagehide', save);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

ensureWishes();
retireUnreachableWishes();   // a save from before the pouch grew, or from 1.0
applySettings();
layout();
if (document.fonts && document.fonts.load) document.fonts.load(font(16, 700)).then(() => { lastInput = now(); }).catch(() => {});
onReturn();
if (!S.intro) openIntro();
else {
  // A save from before 1.2 can hold moons on the board: send them up now,
  // one after another. One that rose but whose ending was never seen (the
  // app closed mid-flight) gets its ending.
  S.board.forEach((t, i) => { if (t === MAX_TIER) later(1200 + 900 * S.board.slice(0, i).filter(x => x === MAX_TIER).length, () => riseMoon(i)); });
  if (S.skyMoons && !S.ended) later(1500, openEnding);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
