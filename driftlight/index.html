<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Driftlight</title>
<meta name="description" content="Steer a swarm of light through twelve dark realms. A particle game, about an hour long.">
<meta name="theme-color" content="#04060f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%2304060f'/%3E%3Ccircle cx='50' cy='50' r='16' fill='%23ffd9a0'/%3E%3Ccircle cx='24' cy='34' r='5' fill='%23fff4d6'/%3E%3Ccircle cx='74' cy='28' r='4' fill='%23fff4d6'/%3E%3Ccircle cx='72' cy='72' r='6' fill='%23fff4d6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* The game is all light on dark, so the interface stays thin and quiet. */
  :root {
    --ink: #f4efe6;
    --dim: rgba(244, 239, 230, .62);
    --line: rgba(244, 239, 230, .28);
    --gold: #ffd9a0;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060f; }
  body { font-family: var(--sans); font-weight: 300; color: var(--ink); user-select: none; -webkit-user-select: none; }
  /* Always fills the window; the drawing resolution inside it can be lower. */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
  [hidden] { display: none !important; }
  .caps { text-transform: uppercase; letter-spacing: .28em; font-size: 11px; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: 18px; right: 18px; z-index: 5;
    display: flex; align-items: flex-start; gap: 16px; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .8);
  }
  #realmName { text-transform: uppercase; letter-spacing: .3em; font-size: 11px; color: var(--dim); }
  #light { font-family: var(--serif); font-size: 15px; color: var(--dim); margin-top: 2px; }
  #lightNum { font-weight: 500; font-size: 26px; color: var(--ink); margin-right: 4px; }
  #lightCap { font-size: 13px; opacity: .7; }
  #light.full #lightNum, #light.full #lightCap { color: var(--gold); opacity: 1; text-shadow: 0 0 10px rgba(255, 217, 160, .7); }
  #light.full #lightCap { text-transform: uppercase; letter-spacing: .2em; font-size: 11px; }
  /* The surge meter under the light count. It fills as you gather. */
  #heat { width: 92px; height: 3px; margin-top: 7px; border-radius: 2px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  #heatFill {
    width: 100%; height: 100%; transform: scaleX(0); transform-origin: left; transition: transform .2s linear;
    background: linear-gradient(90deg, #7fd4ff, #b78cff, #ff7eb6, #ffd24a);
  }
  #heat.surge { height: 5px; box-shadow: 0 0 12px rgba(255, 190, 220, .8); }
  #heat.surge #heatFill { background: linear-gradient(90deg, #ff5a8a, #ffd24a, #7affc8, #6ae8ff, #b78cff, #ff5a8a); background-size: 200% 100%; animation: heat 1s linear infinite; }
  @keyframes heat { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { #heat.surge #heatFill { animation: none; } }
  /* The clock against par, and the current chain of gathered motes. */
  #clock { margin-top: 6px; font-size: 11px; letter-spacing: .14em; color: var(--gold); font-variant-numeric: tabular-nums; }
  #clock.over { color: var(--dim); }
  #combo { margin-top: 4px; min-height: 18px; font-family: var(--serif); font-size: 16px; color: var(--dim); transition: color .2s; }
  #combo.hot { color: #ffd0f0; text-shadow: 0 0 10px rgba(255, 140, 220, .9); }
  #pips { margin: 4px auto 0; display: flex; gap: 9px; }
  #pips i {
    width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--dim); transition: all .8s;
  }
  #pips i.lit { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }
  #pips i.heart { width: 13px; height: 13px; margin-top: -2px; }
  #pauseBtn {
    pointer-events: auto; width: 38px; height: 38px; margin: -6px -8px 0 0; border-radius: 50%;
    letter-spacing: .15em; font-size: 12px; color: var(--dim);
  }
  #pauseBtn:hover { color: var(--ink); }

  /* A line of guidance, top centre: the bottom corners belong to thumbs. */
  #hint {
    position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 58px); left: 50%; z-index: 5;
    transform: translateX(-50%); width: max-content; max-width: min(560px, calc(100vw - 36px));
    font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1.35; text-align: center;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .9); opacity: 0; transition: opacity 1s; pointer-events: none;
  }
  #hint.show { opacity: .95; }
  /* On narrow screens the HUD's four lines sit above the hint, not beside it. */
  @media (max-width: 700px) { #hint { top: calc(max(14px, env(safe-area-inset-top)) + 128px); } }

  /* Arrows at the screen's edge toward stars still sleeping. */
  #arrows i {
    position: fixed; left: 0; top: 0; z-index: 4; width: 0; height: 0; pointer-events: none;
    border-left: 11px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
    opacity: .55; filter: drop-shadow(0 0 6px rgba(255, 255, 255, .6));
  }
  #arrows i.portal { border-left-color: var(--gold); opacity: .95; }
  #beaconLabel {
    position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; white-space: nowrap;
    font-family: var(--serif); font-size: 15px; color: var(--dim); text-shadow: 0 1px 8px #000;
    opacity: 0; transition: opacity .4s;
  }

  /* The touch joystick: a ring where the thumb landed and a knob under it.
     Both sit at the page's corner and are moved with transforms. */
  #stick {
    position: fixed; left: 0; top: 0; z-index: 4; width: 0; height: 0; pointer-events: none;
    opacity: 0; transition: opacity .25s;
  }
  #stick.on { opacity: 1; }
  #stick::before {
    content: ''; position: absolute; left: -56px; top: -56px; width: 112px; height: 112px; border-radius: 50%;
    border: 1px solid rgba(244, 239, 230, .34); background: radial-gradient(circle, rgba(255, 255, 255, .07), transparent 70%);
  }
  #stickKnob {
    position: absolute; left: -21px; top: -21px; width: 42px; height: 42px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, .55), rgba(255, 255, 255, .12) 70%);
    box-shadow: 0 0 18px rgba(255, 255, 255, .45);
  }

  #pulseBtn {
    position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); z-index: 6;
    width: 78px; height: 78px; border-radius: 50%;
    text-transform: uppercase; letter-spacing: .2em; font-size: 10px; color: var(--dim);
    transition: color .3s;
  }
  /* A thin ring that fills as the pulse recharges. --cd: 0..1 */
  #pulseBtn::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--ink) calc(var(--cd, 1) * 360deg), rgba(255, 255, 255, .14) 0);
    -webkit-mask: radial-gradient(circle, transparent 64%, #000 66%); mask: radial-gradient(circle, transparent 64%, #000 66%);
  }
  #pulseBtn.ready { color: var(--ink); }
  /* Dash sits up and to the left of Pulse, both in reach of the right thumb. */
  #dashBtn {
    position: fixed; right: calc(max(20px, env(safe-area-inset-right)) + 84px); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 46px); z-index: 6;
    width: 62px; height: 62px; border-radius: 50%;
    text-transform: uppercase; letter-spacing: .2em; font-size: 9px; color: var(--dim); transition: color .3s;
  }
  #dashBtn::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(#9fe0ff calc(var(--cd, 1) * 360deg), rgba(255, 255, 255, .14) 0);
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 65%); mask: radial-gradient(circle, transparent 62%, #000 65%);
  }
  #dashBtn.ready { color: #cdeeff; }
  @media (pointer: fine) {
    #pulseBtn { width: 58px; height: 58px; font-size: 8px; }
    #dashBtn { width: 48px; height: 48px; font-size: 7px; right: calc(max(20px, env(safe-area-inset-right)) + 66px); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 30px); }
  }

  /* ---------- Realm title card ---------- */
  #card {
    position: fixed; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; pointer-events: none; opacity: 0; transition: opacity 1.6s;
    text-shadow: 0 2px 24px rgba(0, 0, 0, .9);
  }
  #card.show { opacity: 1; }
  #cardNum { font-family: var(--serif); font-size: 20px; letter-spacing: .3em; color: var(--dim); }
  #cardName { font-family: var(--serif); font-weight: 300; font-size: clamp(44px, 9vw, 84px); margin: 6px 0 4px; letter-spacing: .04em; }
  #cardLine { font-family: var(--serif); font-style: italic; font-size: clamp(18px, 3.4vw, 24px); color: var(--dim); margin: 0; }

  /* ---------- Panels ---------- */
  #overlay {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow-y: auto; pointer-events: none; transition: background 1s;
  }
  #overlay.dim { background: rgba(3, 4, 10, .62); pointer-events: auto; }
  #overlay.low { align-items: flex-end; padding-bottom: max(7vh, 30px); }
  #panel { pointer-events: auto; width: min(680px, 100%); margin: auto; text-align: center; opacity: 0; transition: opacity .9s; }
  #overlay.low #panel { margin-bottom: 0; }
  #panel.show { opacity: 1; }
  #panel h2 { font-family: var(--serif); font-weight: 300; font-size: clamp(34px, 7vw, 54px); margin: 0 0 6px; letter-spacing: .04em; }
  #panel p { font-family: var(--serif); font-size: 19px; line-height: 1.45; color: var(--dim); margin: 8px 0; }
  #panel .quote { font-style: italic; font-size: clamp(22px, 4.4vw, 30px); color: var(--ink); line-height: 1.35; }
  .btn {
    display: inline-block; margin: 8px 6px; padding: 12px 30px; border: 1px solid var(--line); border-radius: 999px;
    text-transform: uppercase; letter-spacing: .3em; font-size: 12px; text-decoration: none; color: var(--ink);
    background: rgba(4, 6, 15, .35); transition: border-color .3s, background .3s;
  }
  .btn:hover, .btn:focus-visible { border-color: var(--ink); background: rgba(255, 255, 255, .08); outline: none; }
  .btn.main { border-color: var(--gold); color: var(--gold); padding: 14px 40px; }
  .links { margin-top: 10px; }
  #panel .version { font-family: var(--sans); font-size: 10px; letter-spacing: .25em; color: var(--dim); opacity: .6; margin: 10px 0 0; }
  .link { color: var(--dim); text-transform: uppercase; letter-spacing: .25em; font-size: 10px; text-decoration: none; padding: 8px 10px; }
  .link:hover { color: var(--ink); }
  .gifts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
  @media (max-width: 620px) { .gifts { grid-template-columns: 1fr; } }
  .gift {
    padding: 20px 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(4, 6, 15, .5);
    transition: border-color .3s, background .3s, transform .3s;
  }
  .gift:hover, .gift:focus-visible { border-color: var(--gold); background: rgba(255, 217, 160, .07); transform: translateY(-3px); outline: none; }
  .gift b { display: block; font-family: var(--serif); font-weight: 500; font-size: 24px; color: var(--gold); }
  .gift span { display: block; font-family: var(--serif); font-size: 16px; color: var(--dim); margin-top: 6px; line-height: 1.3; }
  .gift small { display: block; margin-top: 10px; letter-spacing: .3em; color: var(--dim); font-size: 10px; }
  #panel .rating { font-size: 34px; letter-spacing: .2em; color: var(--gold); margin: 0; text-shadow: 0 0 18px rgba(255, 217, 160, .6); }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 28px; max-width: 320px; margin: 18px auto; text-align: left; font-family: var(--serif); font-size: 18px; color: var(--dim); }
  .stats span:nth-child(even) { color: var(--ink); text-align: right; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" hidden>
  <div>
    <div id="realmName"></div>
    <div id="light"><span id="lightNum">0</span>light <span id="lightCap"></span></div>
    <div id="heat"><div id="heatFill"></div></div>
    <div id="clock"></div>
    <div id="combo"></div>
  </div>
  <div id="pips"></div>
  <button id="pauseBtn" aria-label="Pause">II</button>
</div>
<div id="hint" role="status"></div>
<div id="arrows"></div>
<div id="beaconLabel"></div>
<div id="stick"><div id="stickKnob"></div></div>
<button id="pulseBtn" hidden aria-label="Pulse">pulse</button>
<button id="dashBtn" hidden aria-label="Dash">dash</button>

<div id="card">
  <div id="cardNum"></div>
  <h2 id="cardName"></h2>
  <p id="cardLine"></p>
</div>

<div id="overlay"><div id="panel"></div></div>

<!-- Plain scripts in order (no modules), so the game also runs from a file. -->
<script src="js/config.js"></script>
<script src="js/world.js"></script>
<script src="js/gfx.js"></script>
<script src="js/scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
